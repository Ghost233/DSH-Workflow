name: dsh_workflow_launcher
description: Flutter launcher and MacLauncher SDK peer for Ghost DSH Station.
publish_to: none
version: 0.3.7+5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  maclauncher_sdk:
    git:
      url: https://github.com/Ghost233/MacLauncher.git
      path: packages/maclauncher_sdk
      ref: b48c5a9c232a609b59c9510c59cca82046fc9e55

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  vm_service: ^15.3.0
  launcher_core:
    git:
      url: https://github.com/Ghost233/MacLauncher.git
      path: packages/launcher_core
      ref: b48c5a9c232a609b59c9510c59cca82046fc9e55

# The official management core declares a hosted SDK constraint; both sides
# of this application probe must resolve to the same pinned official SDK.
dependency_overrides:
  maclauncher_sdk:
    git:
      url: https://github.com/Ghost233/MacLauncher.git
      path: packages/maclauncher_sdk
      ref: b48c5a9c232a609b59c9510c59cca82046fc9e55

flutter:
  uses-material-design: true
