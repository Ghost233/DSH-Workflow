name: macOS Candidate Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare pinned Browser Harness skill
        run: git submodule update --init vendor/browser-harness

      - name: Check source and ARM64 platform
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == Ghost233/DSH-Workflow ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7

      - name: Build and package ARM64 candidate
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          scripts/build-local-release.sh
          cat .build/release-assets/manifest.json
