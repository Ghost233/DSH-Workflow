name: Flutter Launcher Acceptance

on:
  push:
    branches:
      - codex/flutter-launcher-spec
    paths:
      - .github/workflows/flutter-launcher-acceptance.yml
      - .github/actions/flutter-debug-app/action.yml
      - .github/scripts/flutter_debug_artifact.py
      - .github/scripts/settings_startup_cycle.py
      - .github/scripts/settings_startup_cycle_test.py
      - macos-launcher/**
      - agent-observation-plugin/**
      - matt-skills-panel-plugin/**
      - dynamic-workflow-plugin/**
      - scripts/**
      - vendor/**
      - deepseek-harness
      - .gitmodules
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - dsh-runtime.json
      - project-plugins.json
      - project-plugins.lock.json
      - maclauncher.json
      - start-dsh-workflow.sh
      - '!**/*.md'
      - '!macos-launcher/flutter/tool/desktop_launch_diagnostics.swift'
      - '!macos-launcher/flutter/tool/desktop_launch_observer.dart'
      - '!macos-launcher/flutter/tool/settings_repeat_gate.py'
      - '!macos-launcher/flutter/tool/settings_repeat_gate_test.py'
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful original macos-app producer run (T09 only)
        required: false
        default: ''
        type: string
      preference_only:
        description: Run only the existing saved Desktop startup-window preference scenarios
        required: false
        default: false
        type: boolean
      actor_only:
        description: Run only the owned actor startup and exact-window-close subject
        required: false
        default: false
        type: boolean
      product_source_sha:
        description: Original verified product source SHA for unchanged-material T09 reuse
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validation-inputs:
    if: github.event_name != 'workflow_dispatch' || !inputs.preference_only
    runs-on: macos-15
    outputs:
      helper_only: ${{ steps.proof.outputs.helper_only }}
      native_reuse: ${{ steps.proof.outputs.native_reuse }}
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: proof
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 .github/scripts/actor_validation_inputs.py --base 260fdbbb8a3697899e1133e3293e255df604e0d4 --output validation-inputs.json
          python3 - <<'PY'
          import json, os
          value = json.load(open('validation-inputs.json'))
          helper = value['helperOnly'] and value['materialInputsEqual'] and os.environ['EVENT_NAME'] != 'workflow_dispatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('helper_only=' + str(helper).lower() + '\n')
              output.write('native_reuse=' + str(helper and value['base'] == '260fdbbb8a3697899e1133e3293e255df604e0d4').lower() + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validation-material-inputs-${{ github.workflow }}
          path: validation-inputs.json
  t07:
    needs: validation-inputs
    if: always() && (needs.validation-inputs.result != 'success' || needs.validation-inputs.outputs.native_reuse != 'true') && !inputs.actor_only && !inputs.preference_only && (github.event_name != 'workflow_dispatch' || inputs.release_run_id == '')
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Prepare runner evidence
        run: |
          acceptance_evidence="$RUNNER_TEMP/flutter-launcher-acceptance/T07"
          mkdir -p "$acceptance_evidence"
          printf 'EVIDENCE_DIR=%s\n' "$acceptance_evidence" >> "$GITHUB_ENV"
          sw_vers > "$acceptance_evidence/macos-version.log"
          uname -m > "$acceptance_evidence/architecture.log"

      - name: Checkout candidate without upstream initialization
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Bind checked-out source
        run: git rev-parse HEAD > "$EVIDENCE_DIR/source-commit.txt"

      - name: Set up fixed Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6

      - name: Set up fixed project Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Build current maintained Matt package
        run: |
          npm ci --prefix matt-skills-panel-plugin --ignore-scripts --no-audit --no-fund
          npm run build --prefix matt-skills-panel-plugin

      - name: Verify locked launcher engineering checks
        working-directory: macos-launcher/flutter
        run: |
          flutter --version --machine > "$EVIDENCE_DIR/flutter-version.json"
          dart --version > "$EVIDENCE_DIR/dart-version.log" 2>&1
          set +e
          bash check.sh > "$EVIDENCE_DIR/check.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/check.exit"
          cat "$EVIDENCE_DIR/check.log"
          exit "$result"

      - name: Prepare exact current ARM Debug producer bytes
        uses: ./.github/actions/flutter-debug-app
      - name: Stage the relative application association
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          app = root / 'macos-launcher/flutter/build/macos/Build/Products/Debug/DSH Workflow.app'
          manifest = json.loads((root / 'maclauncher.json').read_text())
          manifest['entry']['path'] = '../..'
          target = app / 'Contents/Resources/maclauncher.json'
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          evidence = Path(os.environ['EVIDENCE_DIR'])
          (evidence / 'input-association.json').write_text(target.read_text())
          (evidence / 'input-app.txt').write_text(str(app) + '\n')
          PY

      - name: Exercise real system login and release URL boundaries
        working-directory: macos-launcher/flutter
        run: |
          set +e
          dart run tool/application_probe.dart \
            'build/macos/Build/Products/Debug/DSH Workflow.app/Contents/MacOS/DSH Workflow' \
            --updates --system-ci > "$EVIDENCE_DIR/application.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/application.exit"
          cat "$EVIDENCE_DIR/application.log"
          exit "$result"

      - name: Collect actual isolated candidate evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE_DIR'])
          evidence.mkdir(parents=True, exist_ok=True)
          payloads = []
          for root in sorted(Path(os.environ['RUNNER_TEMP']).glob('dsh-t07-*')):
              if not root.is_dir():
                  continue
              target = evidence / root.name
              target.mkdir(exist_ok=True)
              for source in root.iterdir():
                  if source.is_file() and source.suffix in ('.log', '.json', '.png'):
                      shutil.copy2(source, target / source.name)
              app = root / 'candidate.app'
              hashes = {}
              for relative in (
                  'Contents/MacOS/DSH Workflow',
                  'Contents/MacOS/DSH Workflow.debug.dylib',
                  'Contents/Frameworks/App.framework/Resources/flutter_assets/kernel_blob.bin',
                  'Contents/Info.plist',
                  'Contents/Resources/maclauncher.json',
              ):
                  file = app / relative
                  hashes[relative] = hashlib.sha256(file.read_bytes()).hexdigest() if file.is_file() else None
              payloads.append({'isolatedRoot': str(root), 'payloadSha256': hashes})
          (evidence / 'isolated-payloads.json').write_text(json.dumps(payloads, indent=2) + '\n')
          PY

      - name: Upload acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-launcher-t07-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flutter-launcher-acceptance/T07
          if-no-files-found: error

  t02:
    needs: [t07, validation-inputs]
    if: always() && (needs.validation-inputs.result != 'success' || needs.validation-inputs.outputs.native_reuse != 'true') && !inputs.actor_only && !inputs.preference_only && (github.event_name != 'workflow_dispatch' || inputs.release_run_id == '')
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Prepare T02 runner evidence
        run: |
          acceptance_evidence="$RUNNER_TEMP/flutter-launcher-acceptance/T02"
          mkdir -p "$acceptance_evidence"
          printf 'EVIDENCE_DIR=%s\n' "$acceptance_evidence" >> "$GITHUB_ENV"
          printf 'T02_RUNTIME_MOUNT=%s\n' "$RUNNER_TEMP/t02-runtime-mount" >> "$GITHUB_ENV"
          sw_vers > "$acceptance_evidence/macos-version.log"
          uname -m > "$acceptance_evidence/architecture.log"

      - name: Checkout current launcher without upstream initialization
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Bind current source and fixed runtime artifact
        run: |
          git rev-parse HEAD > "$EVIDENCE_DIR/source-commit.txt"
          printf '{"repository":"%s","runId":37325723931,"artifactName":"dsh-workflow-arm64"}\n' \
            "$GITHUB_REPOSITORY" > "$EVIDENCE_DIR/runtime-artifact-source.json"

      - name: Download the successful frozen arm64 runtime
        uses: actions/download-artifact@v4
        with:
          name: dsh-workflow-arm64
          run-id: 37325723931
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/t02-runtime-artifact

      - name: Mount the frozen DMG read-only
        run: |
          shopt -s nullglob
          t02_dmgs=("$RUNNER_TEMP/t02-runtime-artifact/"*.dmg)
          test "${#t02_dmgs[@]}" -eq 1
          runtime_dmg="${t02_dmgs[0]}"
          shasum -a 256 "$runtime_dmg" > "$EVIDENCE_DIR/runtime-dmg.sha256"
          hdiutil verify "$runtime_dmg" > "$EVIDENCE_DIR/runtime-dmg-verify.log" 2>&1
          mkdir -p "$T02_RUNTIME_MOUNT"
          set +e
          hdiutil attach -readonly -nobrowse -mountpoint "$T02_RUNTIME_MOUNT" "$runtime_dmg" \
            > "$EVIDENCE_DIR/runtime-mount.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/runtime-mount.exit"
          cat "$EVIDENCE_DIR/runtime-mount.log"
          test "$result" -eq 0
          runtime_resources="$T02_RUNTIME_MOUNT/DSH Workflow.app/Contents/Resources"
          test -x "$runtime_resources/node"
          test -d "$runtime_resources/desktop/DeepSeek Harness.app"
          test "$("$runtime_resources/node" -p 'process.arch')" = arm64
          printf 'T02_RUNTIME_RESOURCES=%s\n' "$runtime_resources" >> "$GITHUB_ENV"
          shasum -a 256 "$runtime_resources/node" \
            "$runtime_resources/desktop/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            "$runtime_resources/desktop/DeepSeek Harness.app/Contents/Resources/app/dsh/node_modules/@deepseek-ai/dsh-desktop-host/lib/index.js" \
            > "$EVIDENCE_DIR/runtime-payload.sha256"

      - name: Set up the fixed current Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6

      - name: Set up fixed project Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Build current maintained Matt package
        run: |
          npm ci --prefix matt-skills-panel-plugin --ignore-scripts --no-audit --no-fund
          npm run build --prefix matt-skills-panel-plugin

      - name: Check current launcher engineering
        working-directory: macos-launcher/flutter
        run: |
          flutter --version --machine > "$EVIDENCE_DIR/flutter-version.json"
          dart --version > "$EVIDENCE_DIR/dart-version.log" 2>&1
          set +e
          bash check.sh > "$EVIDENCE_DIR/check.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/check.exit"
          cat "$EVIDENCE_DIR/check.log"
          exit "$result"

      - name: Restore exact same-run ARM Debug application bytes
        uses: ./.github/actions/flutter-debug-app
        with:
          producer-artifact: flutter-debug-app-t07-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stage the current relative application association
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          app = root / 'macos-launcher/flutter/build/macos/Build/Products/Debug/DSH Workflow.app'
          manifest = json.loads((root / 'maclauncher.json').read_text())
          manifest['entry']['path'] = '../..'
          target = app / 'Contents/Resources/maclauncher.json'
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          evidence = Path(os.environ['EVIDENCE_DIR'])
          (evidence / 'input-association.json').write_text(target.read_text())
          (evidence / 'input-app.txt').write_text(str(app) + '\n')
          PY

      - name: Exercise actual official Desktop and shared Web at 33080
        working-directory: macos-launcher/flutter
        run: |
          set +e
          dart run tool/application_probe.dart \
            'build/macos/Build/Products/Debug/DSH Workflow.app/Contents/MacOS/DSH Workflow' \
            --web-runtime "$T02_RUNTIME_RESOURCES" --web-backend desktop --web-port 33080 \
            > "$EVIDENCE_DIR/application.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/application.exit"
          cat "$EVIDENCE_DIR/application.log"
          exit "$result"

      - name: Observe isolated SDK cold background focus with an external foreground app
        working-directory: macos-launcher/flutter
        run: |
          set +e
          dart run tool/application_probe.dart \
            'build/macos/Build/Products/Debug/DSH Workflow.app/Contents/MacOS/DSH Workflow' \
            --desktop-window-runtime "$T02_RUNTIME_RESOURCES" --window-start sdk-hidden --web-port 33080 \
            > "$EVIDENCE_DIR/external-sdk-cold.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/external-sdk-cold.exit"
          cat "$EVIDENCE_DIR/external-sdk-cold.log"
          exit "$result"

      - name: Preserve only known safe external SDK cold evidence
        if: always()
        run: |
          python3 - <<'PYFOCUS'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from settings_startup_cycle import sanitize_json, sanitize_text, validate_observation_root
          evidence = Path(os.environ['EVIDENCE_DIR'])
          log = evidence / 'external-sdk-cold.log'
          roots = re.findall(r'^ISOLATED_ROOT=(.+)$', log.read_text(), re.M) if log.is_file() else []
          for name in roots:
              root = validate_observation_root(Path(name), Path(os.environ['RUNNER_TEMP']))
              target = evidence / 'external-sdk-cold' / root.name
              target.mkdir(parents=True, exist_ok=True)
              for name in ('app.log', 'probe-process.json', 'probe-timeline.jsonl',
                           'owned-desktop-process.json', 'owned-desktop-cleanup.log',
                           'desktop-window-observations.jsonl', 'desktop-window-evidence.json',
                           'desktop-fixture-copy-evidence.json', 'release-window-identity.json',
                           'external-foreground-original.json', 'external-foreground-baseline.json',
                           'supervision-live.json'):
                  source = root / name
                  if not source.is_file() or source.is_symlink(): continue
                  if source.suffix == '.json':
                      output = json.dumps(sanitize_json(json.loads(source.read_text()))) + '\n'
                  elif source.suffix == '.jsonl':
                      output = ''.join(json.dumps(sanitize_json(json.loads(line))) + '\n' for line in source.read_text().splitlines() if line)
                  else: output = sanitize_text(source.read_text())
                  (target / name).write_text(output)
          PYFOCUS

      - name: Collect T02 observed application and process evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, socket, subprocess
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE_DIR'])
          log = evidence / 'application.log'
          roots = re.findall(r'^ISOLATED_ROOT=(.+)$', log.read_text(), re.M) if log.exists() else []
          results = []
          for name in roots:
              root = Path(name).resolve()
              runner_root = Path(os.environ['RUNNER_TEMP']).resolve()
              if root.parent != runner_root or not root.name.startswith('dsh-t01-') or not root.is_dir():
                  raise RuntimeError('Unexpected isolated native probe root')
              target = evidence / root.name
              target.mkdir(exist_ok=True)
              for file in root.iterdir():
                  if file.is_file() and file.suffix in ('.log', '.json', '.jsonl', '.png'):
                      shutil.copy2(file, target / file.name)
              diagnostic_command = ['python3', 'macos-launcher/flutter/tool/collect_probe_diagnostics.py',
                                    str(root), str(target)]
              diagnostic = subprocess.run(diagnostic_command, capture_output=True, text=True)
              (target / 'diagnostic-collector.log').write_text(diagnostic.stdout + diagnostic.stderr)
              (target / 'diagnostic-collector.exit').write_text(str(diagnostic.returncode) + '\n')
              hashes = {}
              for relative in ('Contents/MacOS/DSH Workflow', 'Contents/MacOS/DSH Workflow.debug.dylib',
                               'Contents/Frameworks/App.framework/Resources/flutter_assets/kernel_blob.bin',
                               'Contents/Info.plist', 'Contents/Resources/maclauncher.json'):
                  file = root / 'candidate.app' / relative
                  hashes[relative] = hashlib.sha256(file.read_bytes()).hexdigest() if file.is_file() else None
              native = {}
              for file in (root / 'web-final.json', root / 'initial-web-ui.json'):
                  if file.exists():
                      native = json.loads(file.read_text()).get('native', {})
                      break
              facts = json.loads((root / 'web-evidence.json').read_text()) if (root / 'web-evidence.json').exists() else {}
              pids = {key: native.get(key) for key in ('pid', 'openedDesktopPid')}
              process_ledger = root / 'probe-process.json'
              if process_ledger.is_file():
                  pids['pid'] = json.loads(process_ledger.read_text()).get('pid')
              pids['hostPid'] = facts.get('hostPid')
              processes = {}
              for key, pid in pids.items():
                  if isinstance(pid, int) and pid > 1:
                      check = subprocess.run(['/bin/kill', '-0', str(pid)], capture_output=True, text=True)
                      processes[key] = {'pid': pid, 'exists': check.returncode == 0, 'stderr': check.stderr.strip()}
              port = socket.socket()
              try:
                  port.bind(('127.0.0.1', 33080))
                  raw_bind = {'available': True}
              except OSError as error:
                  raw_bind = {'available': False, 'errno': error.errno, 'error': str(error)}
              finally:
                  port.close()
              port = socket.socket()
              port.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              try:
                  port.bind(('0.0.0.0', 33080))
                  port.listen(1)
                  service_listen = {'available': True}
              except OSError as error:
                  service_listen = {'available': False, 'errno': error.errno, 'error': str(error)}
              finally:
                  port.close()
              listener = subprocess.run(['/usr/sbin/lsof', '-nP', '-iTCP:33080', '-sTCP:LISTEN', '-Fpn'],
                                        capture_output=True, text=True)
              results.append({'isolatedRoot': name, 'payloadSha256': hashes, 'trackedProcesses': processes,
                              'receiptRemoved': not (root / 'data/global/.dsh-workflow/desktop/desktop-host.json').exists(),
                              'rawNoReuseLoopbackBind': raw_bind,
                              'reuseAddrServiceBindListen': service_listen,
                              'listenObservation': {'exit': listener.returncode, 'stdout': listener.stdout,
                                                    'stderr': listener.stderr},
                              'webPortReleased': service_listen['available']})
          (evidence / 'isolated-payloads-and-cleanup.json').write_text(json.dumps(results, indent=2) + '\n')
          PY

      - name: Detach the read-only runtime even on failure
        if: always()
        run: |
          if mount | grep -Fq " on $T02_RUNTIME_MOUNT "; then
            set +e
            hdiutil detach "$T02_RUNTIME_MOUNT" > "$EVIDENCE_DIR/runtime-detach.log" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "$EVIDENCE_DIR/runtime-detach.exit"
            cat "$EVIDENCE_DIR/runtime-detach.log"
            exit "$result"
          fi

      - name: Upload T02 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-launcher-t02-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flutter-launcher-acceptance/T02
          if-no-files-found: error

  t05:
    needs: validation-inputs
    if: always() && (needs.validation-inputs.result != 'success' || needs.validation-inputs.outputs.native_reuse != 'true') && !inputs.actor_only && !inputs.preference_only && (github.event_name != 'workflow_dispatch' || inputs.release_run_id == '')
    runs-on: macos-15
    timeout-minutes: 35
    concurrency:
      group: flutter-t05-debug-arm64-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Prepare T05 runner evidence
        run: |
          acceptance_evidence="$RUNNER_TEMP/flutter-launcher-acceptance/T05"
          mkdir -p "$acceptance_evidence"
          printf 'EVIDENCE_DIR=%s\n' "$acceptance_evidence" >> "$GITHUB_ENV"
          printf 'T05_RUNTIME_MOUNT=%s\n' "$RUNNER_TEMP/t05-runtime-mount" >> "$GITHUB_ENV"
          sw_vers > "$acceptance_evidence/macos-version.log"
          uname -m > "$acceptance_evidence/architecture.log"

      - name: Checkout current launcher without upstream initialization
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Bind current source and fixed runtime artifact
        run: |
          git rev-parse HEAD > "$EVIDENCE_DIR/source-commit.txt"
          printf '{"repository":"%s","runId":37325723931,"artifactName":"dsh-workflow-arm64"}\n' \
            "$GITHUB_REPOSITORY" > "$EVIDENCE_DIR/runtime-artifact-source.json"

      - name: Download the successful frozen ARM64 runtime
        uses: actions/download-artifact@v4
        with:
          name: dsh-workflow-arm64
          run-id: 37325723931
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/t05-runtime-artifact

      - name: Mount the frozen DMG read-only
        run: |
          shopt -s nullglob
          t05_dmgs=("$RUNNER_TEMP/t05-runtime-artifact/"*.dmg)
          test "${#t05_dmgs[@]}" -eq 1
          runtime_dmg="${t05_dmgs[0]}"
          shasum -a 256 "$runtime_dmg" > "$EVIDENCE_DIR/runtime-dmg.sha256"
          hdiutil verify "$runtime_dmg" > "$EVIDENCE_DIR/runtime-dmg-verify.log" 2>&1
          mkdir -p "$T05_RUNTIME_MOUNT"
          set +e
          hdiutil attach -readonly -nobrowse -mountpoint "$T05_RUNTIME_MOUNT" "$runtime_dmg" \
            > "$EVIDENCE_DIR/runtime-mount.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/runtime-mount.exit"
          cat "$EVIDENCE_DIR/runtime-mount.log"
          test "$result" -eq 0
          runtime_resources="$T05_RUNTIME_MOUNT/DSH Workflow.app/Contents/Resources"
          test -x "$runtime_resources/node"
          test -d "$runtime_resources/desktop/DeepSeek Harness.app"
          test "$("$runtime_resources/node" -p 'process.arch')" = arm64
          printf 'T05_RUNTIME_RESOURCES=%s\n' "$runtime_resources" >> "$GITHUB_ENV"
          shasum -a 256 "$runtime_resources/node" \
            "$runtime_resources/desktop/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            "$runtime_resources/desktop/DeepSeek Harness.app/Contents/Resources/app/dsh/node_modules/@deepseek-ai/dsh-desktop-host/lib/index.js" \
            > "$EVIDENCE_DIR/runtime-payload.sha256"

      - name: Set up the fixed current Flutter toolchain
        id: flutter_toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
          pub-cache-key: flutter-pub-:os:-:version:-:arch:-${{ hashFiles('macos-launcher/flutter/pubspec.lock') }}

      - name: Set up fixed project Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Build current maintained Matt package
        run: |
          npm ci --prefix matt-skills-panel-plugin --ignore-scripts --no-audit --no-fund
          npm run build --prefix matt-skills-panel-plugin

      - name: Check current launcher engineering
        working-directory: macos-launcher/flutter
        run: |
          flutter --version --machine > "$EVIDENCE_DIR/flutter-version.json"
          dart --version > "$EVIDENCE_DIR/dart-version.log" 2>&1
          set +e
          bash check.sh > "$EVIDENCE_DIR/check.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/check.exit"
          cat "$EVIDENCE_DIR/check.log"
          exit "$result"

      - name: Save fixed Flutter SDK before business acceptance
        if: steps.flutter_toolchain.outputs.CACHE-HIT != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.flutter_toolchain.outputs.CACHE-KEY }}
          path: ${{ steps.flutter_toolchain.outputs.CACHE-PATH }}

      - name: Save locked pub dependencies before business acceptance
        if: steps.flutter_toolchain.outputs.PUB-CACHE-HIT != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.flutter_toolchain.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
          path: ${{ steps.flutter_toolchain.outputs.PUB-CACHE-PATH }}

      - name: Prepare exact current Debug application bytes
        uses: ./.github/actions/flutter-debug-app

      - name: Stage the current relative application association
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          app = root / 'macos-launcher/flutter/build/macos/Build/Products/Debug/DSH Workflow.app'
          manifest = json.loads((root / 'maclauncher.json').read_text())
          manifest['entry']['path'] = '../..'
          target = app / 'Contents/Resources/maclauncher.json'
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          evidence = Path(os.environ['EVIDENCE_DIR'])
          (evidence / 'input-association.json').write_text(target.read_text())
          (evidence / 'input-app.txt').write_text(str(app) + '\n')
          PY

      - name: Exercise settings and normal Desktop permission reopen
        working-directory: macos-launcher/flutter
        run: python3 ../../.github/scripts/settings_startup_cycle.py --full

      - name: Preserve completed T05 command before diagnostics
        id: completed_t05_command
        if: always()
        run: python3 .github/scripts/settings_startup_cycle.py --completed-full

      - name: Upload completed T05 command before diagnostics
        if: ${{ always() && steps.completed_t05_command.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-launcher-t05-command-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flutter-launcher-acceptance/T05/completed-command
          if-no-files-found: error

      - name: Collect T05 observed application and process evidence
        if: always()
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import errno, hashlib, json, os, re, shutil, socket, subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0, '.github/scripts')
          from settings_startup_cycle import can_repeat, collect_owned_processes, copy_safe_evidence, launcher_web_released, observe_os_query, run_diagnostics, validate_root
          evidence = Path(os.environ['EVIDENCE_DIR'])
          log = evidence / 'application.log'
          roots = re.findall(r'^ISOLATED_ROOT=(.+)$', log.read_text(), re.M) if log.exists() else []
          results = []
          functional_failed = not bool(roots)
          print('T05_COLLECTOR_PHASE=root-validation-start', flush=True)
          for name in roots:
              root = validate_root(name, Path(os.environ['RUNNER_TEMP']))
              target = evidence / root.name
              target.mkdir(exist_ok=True)
              print('T05_COLLECTOR_PHASE=copy-start ROOT=' + root.name, flush=True)
              copy_safe_evidence(root, target, allow_independent_unknown=True)
              print('T05_COLLECTOR_PHASE=copy-end ROOT=' + root.name, flush=True)
              auxiliary = target / 'auxiliary-diagnostics'
              auxiliary.mkdir(exist_ok=True)
              auxiliary_exit = run_diagnostics(root, auxiliary)
              (target / 'auxiliary-diagnostics-status.json').write_text(json.dumps({
                  'exit': auxiliary_exit, 'functionalCommandExitUnchanged': True,
                  'physicalGateUnchanged': True, 'auxiliaryOutputRetained': auxiliary_exit == 0}) + '\n')
              if auxiliary_exit != 0:
                  shutil.copy2(auxiliary / 'diagnostic-collector.log', target / 'diagnostic-collector.log')
                  shutil.copy2(auxiliary / 'diagnostic-collector.exit', target / 'diagnostic-collector.exit')
                  shutil.rmtree(auxiliary)
                  print('::warning::T05 auxiliary system/crash diagnostics failed or are unavailable; exit=' + str(auxiliary_exit), flush=True)
              print('T05_COLLECTOR_PHASE=hash-start ROOT=' + root.name, flush=True)
              hashes = {}
              for relative in ('Contents/MacOS/DSH Workflow', 'Contents/MacOS/DSH Workflow.debug.dylib',
                               'Contents/Frameworks/App.framework/Resources/flutter_assets/kernel_blob.bin',
                               'Contents/Info.plist', 'Contents/Resources/maclauncher.json'):
                  file = root / 'candidate.app' / relative
                  hashes[relative] = hashlib.sha256(file.read_bytes()).hexdigest() if file.is_file() else None
              print('T05_COLLECTOR_PHASE=hash-end ROOT=' + root.name, flush=True)
              owned_log = log
              command_exit_file = evidence / 'application.exit'
              functional_command_exit = int(command_exit_file.read_text().strip()) if command_exit_file.is_file() and not command_exit_file.is_symlink() else None
              owned = collect_owned_processes(owned_log, Path(os.environ['RUNNER_TEMP']))
              processes = owned['processes']
              print('T05_COLLECTOR_PHASE=port-observation-start ROOT=' + root.name, flush=True)
              port = socket.socket()
              try:
                  port.bind(('127.0.0.1', 33080))
                  raw_bind = {'available': True}
              except OSError as error:
                  raw_bind = {'available': False, 'errno': error.errno, 'error': str(error)}
              finally:
                  port.close()
              port = socket.socket()
              port.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              try:
                  port.bind(('0.0.0.0', 33080))
                  port.listen(1)
                  service_listen = {'available': True}
              except OSError as error:
                  service_listen = {'available': False, 'errno': error.errno, 'error': str(error)}
              finally:
                  port.close()
              listener = observe_os_query(['/usr/sbin/lsof', '-nP', '-iTCP:33080', '-sTCP:LISTEN', '-Fpn'])
              physical_complete = owned['hostBindingKnown'] and can_repeat({'ownership': owned['ownership'], 'processes': list(processes.values()), 'finallyComplete': owned['finallyComplete'], 'receipt': owned['receiptLookup'], 'listener': {key: listener[key] for key in ('exit', 'stdout', 'stderr')}, 'bindListen': service_listen})
              resources_released = launcher_web_released(owned, listener, service_listen)
              normal_exit = owned['normalExitStage']
              settings_body = json.loads((target / 'settings-evidence.json').read_text())
              request = settings_body.get('permissionNormalRequest') or {}
              permission_verified = (settings_body.get('fullAccessSaved') is True
                  and settings_body.get('permissionReopenVerified') is True
                  and settings_body.get('permissionOriginalExitObserved') is True
                  and settings_body.get('permissionModeBeforeReopen') == 'workspace-write'
                  and settings_body.get('permissionModeAfterReopen') == 'danger-full-access'
                  and request.get('lookupFound') is True and request.get('accepted') is True
                  and isinstance(settings_body.get('oldDesktopPid'), int) and settings_body['oldDesktopPid'] > 1
                  and isinstance(settings_body.get('newDesktopPid'), int) and settings_body['newDesktopPid'] > 1
                  and request.get('expectedPid') == settings_body['oldDesktopPid']
                  and settings_body['newDesktopPid'] != settings_body['oldDesktopPid']
                  and isinstance(settings_body.get('oldHostPid'), int) and settings_body['oldHostPid'] > 1
                  and isinstance(settings_body.get('hostPid'), int) and settings_body['hostPid'] > 1
                  and settings_body['hostPid'] != settings_body['oldHostPid']
                  and isinstance(settings_body.get('initialBackendLease'), str)
                  and isinstance(settings_body.get('reopenedBackendLease'), str)
                  and bool(settings_body['reopenedBackendLease'])
                  and settings_body['reopenedBackendLease'] != settings_body['initialBackendLease'])
              functional_complete = functional_command_exit == 0 and normal_exit is not None and normal_exit.get('code') == 0 and resources_released and permission_verified
              functional_failed = not functional_complete or functional_failed
              if not physical_complete:
                  print('::warning::Isolated Desktop/Host cleanup is incomplete or unknown; functional Launcher/Web result is separate', flush=True)
              print('T05_COLLECTOR_PHASE=port-observation-end ROOT=' + root.name, flush=True)
              results.append({'isolatedRoot': name, 'payloadSha256': hashes, 'trackedProcesses': processes, 'ownership': owned['ownership'], 'hostBindingKnown': owned['hostBindingKnown'],
                              'functionalCommandExit': functional_command_exit, 'normalExitStage': normal_exit,
                              'permissionReopenVerified': permission_verified, 'settingsBusinessEvidence': settings_body,
                              'launcherWebReleased': resources_released, 'functionalAcceptanceComplete': functional_complete, 'isolatedCleanup': owned['isolatedCleanup'],
                              'allOwnedProcessesGone': physical_complete, 'finallyComplete': owned['finallyComplete'], 'receiptLookup': owned['receiptLookup'],
                              'receiptRemoved': True if owned['receiptLookup'].get('state') == 'absent' and owned['receiptLookup'].get('errno') == errno.ENOENT else (False if owned['receiptLookup'].get('state') == 'present' else None),
                              'rawNoReuseLoopbackBind': raw_bind,
                              'reuseAddrServiceBindListen': service_listen,
                              'listenObservation': listener,
                              'webPortReleased': service_listen['available'] and not listener['timedOut']})
          (evidence / 'isolated-payloads-and-cleanup.json').write_text(json.dumps(results, indent=2) + '\n')
          print('T05_COLLECTOR_PHASE=complete', flush=True)
          if functional_failed:
              raise RuntimeError('Required permission reopen, Launcher normal exit or Web release is unknown or incomplete; isolated cleanup recorded separately')
          PY

      - name: Record isolated runtime detach separately
        if: always()
        continue-on-error: true
        run: |
          if mount | grep -Fq " on $T05_RUNTIME_MOUNT "; then
            set +e
            hdiutil detach "$T05_RUNTIME_MOUNT" > "$EVIDENCE_DIR/runtime-detach.log" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "$EVIDENCE_DIR/runtime-detach.exit"
            cat "$EVIDENCE_DIR/runtime-detach.log"
            if [ "$result" -ne 0 ]; then
              printf '::warning::Isolated runtime detach incomplete; recorded exit=%s\n' "$result"
            fi
            exit "$result"
          fi

      - name: Upload T05 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-launcher-t05-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flutter-launcher-acceptance/T05
          if-no-files-found: error

  t06:
    needs: [t07, validation-inputs]
    if: always() && (needs.validation-inputs.result != 'success' || needs.validation-inputs.outputs.native_reuse != 'true') && !inputs.actor_only && !inputs.preference_only && (github.event_name != 'workflow_dispatch' || inputs.release_run_id == '')
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Prepare T06 runner evidence
        run: |
          acceptance_evidence="$RUNNER_TEMP/flutter-launcher-acceptance/T06"
          mkdir -p "$acceptance_evidence"
          printf 'EVIDENCE_DIR=%s\n' "$acceptance_evidence" >> "$GITHUB_ENV"
          printf 'T06_RUNTIME_MOUNT=%s\n' "$RUNNER_TEMP/t06-runtime-mount" >> "$GITHUB_ENV"
          sw_vers > "$acceptance_evidence/macos-version.log"
          uname -m > "$acceptance_evidence/architecture.log"
          /usr/sbin/ioreg -n Root -d 1 | python3 -c 'import sys; print("".join(line for line in sys.stdin if "IOConsoleUsers" in line))' \
            > "$acceptance_evidence/console-before.log"

      - name: Checkout current launcher without upstream initialization
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Bind current source and fixed runtime artifact
        run: |
          git rev-parse HEAD > "$EVIDENCE_DIR/source-commit.txt"
          printf '{"repository":"%s","runId":37325723931,"artifactName":"dsh-workflow-arm64"}\n' \
            "$GITHUB_REPOSITORY" > "$EVIDENCE_DIR/runtime-artifact-source.json"

      - name: Download the successful frozen arm64 runtime
        uses: actions/download-artifact@v4
        with:
          name: dsh-workflow-arm64
          run-id: 37325723931
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/t06-runtime-artifact

      - name: Mount the frozen DMG read-only
        run: |
          shopt -s nullglob
          t06_dmgs=("$RUNNER_TEMP/t06-runtime-artifact/"*.dmg)
          test "${#t06_dmgs[@]}" -eq 1
          runtime_dmg="${t06_dmgs[0]}"
          shasum -a 256 "$runtime_dmg" > "$EVIDENCE_DIR/runtime-dmg.sha256"
          hdiutil verify "$runtime_dmg" > "$EVIDENCE_DIR/runtime-dmg-verify.log" 2>&1
          mkdir -p "$T06_RUNTIME_MOUNT"
          set +e
          hdiutil attach -readonly -nobrowse -mountpoint "$T06_RUNTIME_MOUNT" "$runtime_dmg" \
            > "$EVIDENCE_DIR/runtime-mount.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/runtime-mount.exit"
          cat "$EVIDENCE_DIR/runtime-mount.log"
          test "$result" -eq 0
          runtime_resources="$T06_RUNTIME_MOUNT/DSH Workflow.app/Contents/Resources"
          test -x "$runtime_resources/node"
          test -d "$runtime_resources/desktop/DeepSeek Harness.app"
          test "$("$runtime_resources/node" -p 'process.arch')" = arm64
          printf 'T06_RUNTIME_RESOURCES=%s\n' "$runtime_resources" >> "$GITHUB_ENV"
          shasum -a 256 "$runtime_resources/node" \
            "$runtime_resources/desktop/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            "$runtime_resources/desktop/DeepSeek Harness.app/Contents/Resources/app/dsh/node_modules/@deepseek-ai/dsh-desktop-host/lib/index.js" \
            > "$EVIDENCE_DIR/runtime-payload.sha256"

      - name: Set up the fixed current Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6

      - name: Set up fixed project Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Build current maintained Matt package
        run: |
          npm ci --prefix matt-skills-panel-plugin --ignore-scripts --no-audit --no-fund
          npm run build --prefix matt-skills-panel-plugin

      - name: Check current launcher engineering
        working-directory: macos-launcher/flutter
        run: |
          flutter --version --machine > "$EVIDENCE_DIR/flutter-version.json"
          dart --version > "$EVIDENCE_DIR/dart-version.log" 2>&1
          set +e
          bash check.sh > "$EVIDENCE_DIR/check.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/check.exit"
          cat "$EVIDENCE_DIR/check.log"
          exit "$result"

      - name: Restore exact same-run ARM Debug application bytes
        uses: ./.github/actions/flutter-debug-app
        with:
          producer-artifact: flutter-debug-app-t07-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stage the current relative application association
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          app = root / 'macos-launcher/flutter/build/macos/Build/Products/Debug/DSH Workflow.app'
          manifest = json.loads((root / 'maclauncher.json').read_text())
          manifest['entry']['path'] = '../..'
          target = app / 'Contents/Resources/maclauncher.json'
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          evidence = Path(os.environ['EVIDENCE_DIR'])
          (evidence / 'input-association.json').write_text(target.read_text())
          (evidence / 'input-app.txt').write_text(str(app) + '\n')
          paths = ('Contents/MacOS/DSH Workflow', 'Contents/MacOS/DSH Workflow.debug.dylib',
                   'Contents/Frameworks/App.framework/Resources/flutter_assets/kernel_blob.bin',
                   'Contents/Info.plist', 'Contents/Resources/maclauncher.json')
          hashes = {path: hashlib.sha256((app / path).read_bytes()).hexdigest() for path in paths}
          (evidence / 'input-candidate-sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')
          PY

      - name: Exercise actual entry handoff, late actions and window activation
        working-directory: macos-launcher/flutter
        run: |
          set +e
          dart run tool/application_probe.dart \
            'build/macos/Build/Products/Debug/DSH Workflow.app/Contents/MacOS/DSH Workflow' \
            --entry-runtime "$T06_RUNTIME_RESOURCES" \
            > "$EVIDENCE_DIR/application.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/application.exit"
          cat "$EVIDENCE_DIR/application.log"
          exit "$result"

      - name: Collect T06 native timeline, application and exact cleanup evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, socket, subprocess
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE_DIR'])
          console = subprocess.run(['/usr/sbin/ioreg', '-n', 'Root', '-d', '1'], capture_output=True, text=True)
          raw_console = '\n'.join(line for line in console.stdout.splitlines() if 'IOConsoleUsers' in line)
          (evidence / 'console-after.log').write_text(raw_console + '\n')
          (evidence / 'console-after.exit').write_text(str(console.returncode) + '\n')
          log = evidence / 'application.log'
          roots = re.findall(r'^ISOLATED_ROOT=(.+)$', log.read_text(), re.M) if log.exists() else []
          processes = subprocess.check_output(['/bin/ps', '-axo', 'pid=,ppid=,args='], text=True)
          results = []
          for name in roots:
              root = Path(name)
              if root.parent != Path('/private/tmp') or not root.name.startswith('dsh-t06-') or not root.is_dir():
                  raise RuntimeError('Unexpected isolated entry probe root')
              target = evidence / root.name
              target.mkdir(exist_ok=True)
              for file in root.iterdir():
                  if file.is_file() and file.suffix in ('.log', '.json', '.jsonl', '.png'):
                      shutil.copy2(file, target / file.name)
              trace = root / 'data/entry-native.jsonl'
              if trace.exists():
                  shutil.copy2(trace, target / trace.name)
              hashes = {}
              for relative in ('Contents/MacOS/DSH Workflow', 'Contents/MacOS/DSH Workflow.debug.dylib',
                               'Contents/Frameworks/App.framework/Resources/flutter_assets/kernel_blob.bin',
                               'Contents/Info.plist', 'Contents/Resources/maclauncher.json'):
                  file = root / 'candidate.app' / relative
                  hashes[relative] = hashlib.sha256(file.read_bytes()).hexdigest() if file.is_file() else None
              facts_file = root / 'entry-before-takeover.json'
              facts = json.loads(facts_file.read_text()) if facts_file.exists() else {}
              stage = json.loads((root / 'entry-stage.json').read_text()) if (root / 'entry-stage.json').exists() else {}
              initial = root / 'initial-web-ui.json'
              native = facts.get('native', {})
              if not native and initial.exists():
                  native = json.loads(initial.read_text()).get('native', {})
              pids = {'launcher': native.get('pid'), 'supervisor': facts.get('supervisorPid'), 'host': facts.get('hostPid')}
              if pids['host'] is None and (root / 'host.log').exists():
                  match = re.search(r'^HOST_PID=(\d+)$', (root / 'host.log').read_text(), re.M)
                  if match:
                      pids['host'] = int(match[1])
              tracked = {}
              for key, pid in pids.items():
                  if isinstance(pid, int) and pid > 1:
                      check = subprocess.run(['/bin/kill', '-0', str(pid)], capture_output=True, text=True)
                      tracked[key] = {'pid': pid, 'exists': check.returncode == 0, 'exit': check.returncode,
                                      'stderr': check.stderr.strip()}
              remaining = [line for line in processes.splitlines() if name in line and int(line.split()[0]) != os.getpid()]
              port = facts.get('webPort', stage.get('port'))
              observations = {}
              if isinstance(port, int):
                  for label, host, reuse in [('rawNoReuseLoopback', '127.0.0.1', False), ('serviceLikeListen', '0.0.0.0', True)]:
                      listener = socket.socket()
                      if reuse:
                          listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                      try:
                          listener.bind((host, port))
                          listener.listen(1)
                          observations[label] = {'available': True}
                      except OSError as error:
                          observations[label] = {'available': False, 'errno': error.errno, 'error': str(error)}
                      finally:
                          listener.close()
                  listener = subprocess.run(['/usr/sbin/lsof', '-nP', f'-iTCP:{port}', '-sTCP:LISTEN', '-Fpn'], capture_output=True, text=True)
                  observations['lsof'] = {'exit': listener.returncode, 'stdout': listener.stdout, 'stderr': listener.stderr}
              results.append({'isolatedRoot': name, 'payloadSha256': hashes, 'trackedProcesses': tracked,
                              'collectorPid': os.getpid(), 'remainingPrivateRootProcesses': remaining, 'port': port,
                              'portObservations': observations,
                              'receiptRemoved': not (root / 'data/global/.dsh-workflow/desktop/desktop-host.json').exists(),
                              'managerSocketRemoved': not (root / 'manager/sdk-v1.sock').exists(),
                              'managerEndpointFiles': [file.name for file in (root / 'manager').glob('*')]})
          (evidence / 'isolated-payloads-and-cleanup.json').write_text(json.dumps(results, indent=2) + '\n')
          if any(any(pid['exists'] for pid in result['trackedProcesses'].values()) or
                 result['remainingPrivateRootProcesses'] or not result['receiptRemoved'] or
                 not result['managerSocketRemoved'] or
                 not result['portObservations'].get('serviceLikeListen', {}).get('available', False) for result in results):
              raise RuntimeError('Owned entry scenario resources are not all released; raw evidence retained')
          PY

      - name: Detach the read-only runtime even on failure
        if: always()
        run: |
          if mount | grep -Fq " on $T06_RUNTIME_MOUNT "; then
            set +e
            hdiutil detach "$T06_RUNTIME_MOUNT" > "$EVIDENCE_DIR/runtime-detach.log" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "$EVIDENCE_DIR/runtime-detach.exit"
            cat "$EVIDENCE_DIR/runtime-detach.log"
            exit "$result"
          fi

      - name: Upload T06 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-launcher-t06-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flutter-launcher-acceptance/T06
          if-no-files-found: error
  t08:
    needs: [t07, validation-inputs]
    if: always() && (needs.validation-inputs.result != 'success' || needs.validation-inputs.outputs.native_reuse != 'true') && !inputs.actor_only && !inputs.preference_only && (github.event_name != 'workflow_dispatch' || inputs.release_run_id == '')
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Prepare T08 runner evidence
        run: |
          acceptance_evidence="$RUNNER_TEMP/flutter-launcher-acceptance/T08"
          mkdir -p "$acceptance_evidence"
          printf 'EVIDENCE_DIR=%s\n' "$acceptance_evidence" >> "$GITHUB_ENV"
          printf 'T08_RUNTIME_MOUNT=%s\n' "$RUNNER_TEMP/t08-runtime-mount" >> "$GITHUB_ENV"
          sw_vers > "$acceptance_evidence/macos-version.log"
          uname -m > "$acceptance_evidence/architecture.log"

      - name: Checkout current launcher without upstream initialization
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Bind current source and fixed runtime artifact
        run: |
          git rev-parse HEAD > "$EVIDENCE_DIR/source-commit.txt"
          printf '{"repository":"%s","runId":37325723931,"artifactName":"dsh-workflow-arm64"}\n' \
            "$GITHUB_REPOSITORY" > "$EVIDENCE_DIR/runtime-artifact-source.json"

      - name: Download the successful frozen arm64 runtime
        uses: actions/download-artifact@v4
        with:
          name: dsh-workflow-arm64
          run-id: 37325723931
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/t08-runtime-artifact

      - name: Mount the frozen DMG read-only
        run: |
          shopt -s nullglob
          t08_dmgs=("$RUNNER_TEMP/t08-runtime-artifact/"*.dmg)
          test "${#t08_dmgs[@]}" -eq 1
          runtime_dmg="${t08_dmgs[0]}"
          shasum -a 256 "$runtime_dmg" > "$EVIDENCE_DIR/runtime-dmg.sha256"
          hdiutil verify "$runtime_dmg" > "$EVIDENCE_DIR/runtime-dmg-verify.log" 2>&1
          mkdir -p "$T08_RUNTIME_MOUNT"
          set +e
          hdiutil attach -readonly -nobrowse -mountpoint "$T08_RUNTIME_MOUNT" "$runtime_dmg" \
            > "$EVIDENCE_DIR/runtime-mount.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/runtime-mount.exit"
          cat "$EVIDENCE_DIR/runtime-mount.log"
          test "$result" -eq 0
          runtime_resources="$T08_RUNTIME_MOUNT/DSH Workflow.app/Contents/Resources"
          test -x "$runtime_resources/node"
          test -d "$runtime_resources/desktop/DeepSeek Harness.app"
          test "$("$runtime_resources/node" -p 'process.arch')" = arm64
          printf 'T08_RUNTIME_RESOURCES=%s\n' "$runtime_resources" >> "$GITHUB_ENV"
          shasum -a 256 "$runtime_resources/node" \
            "$runtime_resources/desktop/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            "$runtime_resources/desktop/DeepSeek Harness.app/Contents/Resources/app/dsh/node_modules/@deepseek-ai/dsh-desktop-host/lib/index.js" \
            > "$EVIDENCE_DIR/runtime-payload.sha256"

      - name: Set up the fixed current Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6

      - name: Set up fixed project Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Build current maintained Matt package
        run: |
          npm ci --prefix matt-skills-panel-plugin --ignore-scripts --no-audit --no-fund
          npm run build --prefix matt-skills-panel-plugin

      - name: Check current launcher engineering
        working-directory: macos-launcher/flutter
        run: |
          flutter --version --machine > "$EVIDENCE_DIR/flutter-version.json"
          dart --version > "$EVIDENCE_DIR/dart-version.log" 2>&1
          set +e
          bash check.sh > "$EVIDENCE_DIR/check.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/check.exit"
          cat "$EVIDENCE_DIR/check.log"
          exit "$result"

      - name: Restore exact same-run ARM Debug application bytes
        uses: ./.github/actions/flutter-debug-app
        with:
          producer-artifact: flutter-debug-app-t07-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stage the current relative application association
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          app = root / 'macos-launcher/flutter/build/macos/Build/Products/Debug/DSH Workflow.app'
          manifest = json.loads((root / 'maclauncher.json').read_text())
          manifest['entry']['path'] = '../..'
          target = app / 'Contents/Resources/maclauncher.json'
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          evidence = Path(os.environ['EVIDENCE_DIR'])
          (evidence / 'input-association.json').write_text(target.read_text())
          (evidence / 'input-app.txt').write_text(str(app) + '\n')
          PY

      - name: Exercise plugin UI, isolated installation and normal Desktop reload
        working-directory: macos-launcher/flutter
        run: |
          set +e
          dart run tool/application_probe.dart \
            'build/macos/Build/Products/Debug/DSH Workflow.app/Contents/MacOS/DSH Workflow' \
            --plugins-desktop-runtime "$T08_RUNTIME_RESOURCES" \
            > "$EVIDENCE_DIR/application.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/application.exit"
          cat "$EVIDENCE_DIR/application.log"
          exit "$result"

      - name: Collect T08 observed application and process evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, socket, subprocess
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE_DIR'])
          log = evidence / 'application.log'
          roots = re.findall(r'^ISOLATED_ROOT=(.+)$', log.read_text(), re.M) if log.exists() else []
          results = []
          functional_failed = not bool(roots)
          command_exit_file = evidence / 'application.exit'
          command_exit = int(command_exit_file.read_text().strip()) if command_exit_file.is_file() and not command_exit_file.is_symlink() else None
          for name in roots:
              root = Path(name).resolve()
              runner_root = Path(os.environ['RUNNER_TEMP']).resolve()
              if root.parent != runner_root or not root.name.startswith('dsh-t01-') or not root.is_dir():
                  raise RuntimeError('Unexpected isolated native plugin root')
              target = evidence / root.name
              target.mkdir(exist_ok=True)
              diagnostic_command = ['python3', 'macos-launcher/flutter/tool/collect_probe_diagnostics.py',
                                    str(root), str(target / 'owned-diagnostics'), '--crashes']
              diagnostic = subprocess.run(diagnostic_command, capture_output=True, text=True)
              (target / 'diagnostic-collector.log').write_text(diagnostic.stdout + diagnostic.stderr)
              (target / 'diagnostic-collector.exit').write_text(str(diagnostic.returncode) + '\n')
              pids = set()
              for file in root.iterdir():
                  if not file.is_symlink() and file.is_file() and file.resolve().parent == root and file.suffix in ('.log', '.json', '.jsonl', '.png'):
                      shutil.copy2(file, target / file.name)
                      if file.suffix == '.json':
                          value = json.loads(file.read_text())
                          if isinstance(value, dict):
                              native = value.get('native', {})
                              for pid in (native.get('pid'),):
                                  if isinstance(pid, int): pids.add(pid)
              registry = root / 'plugin-registry'
              if registry.is_dir():
                  out = target / 'plugin-registry'
                  out.mkdir(exist_ok=True)
                  for file in registry.iterdir():
                      if file.is_file() and file.name in ('evidence.json', 'seed.log', 'ca.pem'):
                          shutil.copy2(file, out / file.name)
              case = json.loads((target / 'plugin-case.json').read_text()) if (target / 'plugin-case.json').exists() else {}
              for key in ('launcherPid', 'registryPid') + (() if case.get('desktop') is True else ('ownedHostPid',)):
                  if isinstance(case.get(key), int): pids.add(case[key])
              installed = json.loads((target / 'plugin-installed-versions.json').read_text()) if (target / 'plugin-installed-versions.json').exists() else []
              loaded = json.loads((target / 'plugin-loaded-versions.json').read_text()) if (target / 'plugin-loaded-versions.json').is_file() and not (target / 'plugin-loaded-versions.json').is_symlink() else []
              termination = json.loads((target / 'plugin-native-termination.json').read_text()) if (target / 'plugin-native-termination.json').is_file() and not (target / 'plugin-native-termination.json').is_symlink() else []
              processes = []
              for pid in sorted(pids):
                  check = subprocess.run(['/bin/kill', '-0', str(pid)], capture_output=True, text=True)
                  processes.append({'pid': pid, 'exists': check.returncode == 0, 'exit': check.returncode, 'stderr': check.stderr.strip()})
              port = socket.socket()
              port.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              try:
                  port.bind(('0.0.0.0', 33080)); port.listen(1)
                  web_port_released = True
              except OSError:
                  web_port_released = False
              finally:
                  port.close()
              hashes = {}
              for relative in ('Contents/MacOS/DSH Workflow', 'Contents/MacOS/DSH Workflow.debug.dylib',
                               'Contents/Frameworks/App.framework/Resources/flutter_assets/kernel_blob.bin',
                               'Contents/Info.plist', 'Contents/Resources/maclauncher.json'):
                  file = root / 'candidate.app' / relative
                  hashes[relative] = hashlib.sha256(file.read_bytes()).hexdigest() if file.is_file() else None
              timeline = [json.loads(line) for line in (root / 'probe-timeline.jsonl').read_text().splitlines()]
              normal_exit = next((row for row in reversed(timeline) if row.get('event') == 'application-normal-exit-stage' and row.get('pid') == case.get('launcherPid')), None)
              own_ids_known = all(isinstance(case.get(key), int) and case[key] > 1 for key in ('launcherPid', 'registryPid') + (() if case.get('desktop') is True else ('ownedHostPid',)))
              resources_released = own_ids_known and bool(processes) and all(row['exit'] != 0 and 'No such process' in row['stderr'] for row in processes) and web_port_released
              final_packages = installed[-1] if installed else {}
              installed_versions_known = final_packages.get('owned', {}).get('version') == '1.2.0' and final_packages.get('other', {}).get('version') == '1.1.0'
              original_exit = termination[-1] if termination else {}
              request = original_exit.get('normalRequest') or {}
              checks = original_exit.get('processChecks', [])
              before_load = loaded[0] if loaded else {}
              after_load = loaded[-1] if loaded else {}
              old_host, new_host = before_load.get('owned', {}), after_load.get('owned', {})
              loaded_versions_known = (case.get('desktop') is True
                  and len(loaded) == 6 and before_load.get('stage') == 'before-update'
                  and after_load.get('stage') == 'after-native-Desktop-reopen'
                  and all(row.get('owned', {}).get('version') == '1.0.0' and row.get('other', {}).get('version') == '1.0.0' for row in loaded[:-1])
                  and after_load.get('owned', {}).get('version') == '1.2.0' and after_load.get('other', {}).get('version') == '1.1.0'
                  and isinstance(old_host.get('hostPid'), int) and old_host['hostPid'] == case.get('hostPid')
                  and isinstance(new_host.get('hostPid'), int) and new_host['hostPid'] != old_host['hostPid']
                  and old_host.get('hostLease') == case.get('hostLease')
                  and isinstance(new_host.get('hostLease'), str) and bool(new_host['hostLease']) and new_host['hostLease'] != old_host.get('hostLease')
                  and after_load.get('other', {}).get('hostPid') == new_host['hostPid']
                  and after_load.get('other', {}).get('hostLease') == new_host['hostLease']
                  and after_load.get('desktop', {}).get('instanceId') == new_host['hostLease'])
              original_termination_known = (bool(termination) and request.get('lookupFound') is True and request.get('accepted') is True
                  and request.get('expectedPid') == original_exit.get('desktopPid')
                  and original_exit.get('hostPid') == case.get('hostPid') and original_exit.get('receiptAbsent') is True
                  and len(checks) == 2 and {row.get('pid') for row in checks} == {original_exit.get('desktopPid'), case.get('hostPid')}
                  and all(row.get('predicateGone') is True and row.get('rawExit') not in (None, 0) and 'No such process' in row.get('rawStderr', '') for row in checks))
              cleanup_events = [row for row in timeline if row.get('event', '').startswith('ci-desktop-cleanup')]
              if cleanup_events:
                  print('::warning::Independent CI Desktop cleanup is incomplete or unknown; original reload verdict remains separate', flush=True)
              functional_complete = command_exit == 0 and normal_exit is not None and normal_exit.get('code') == 0 and resources_released and installed_versions_known and loaded_versions_known and original_termination_known
              functional_failed = not functional_complete or functional_failed
              results.append({'isolatedRoot': name, 'payloadSha256': hashes, 'trackedProcesses': processes,
                              'installedVersions': installed, 'loadedVersions': loaded, 'originalDesktopTermination': termination,
                              'loadedVersionsVerified': loaded_versions_known, 'originalDesktopTerminationVerified': original_termination_known,
                              'isolatedCleanupEvents': cleanup_events, 'webPortReleased': web_port_released,
                              'functionalCommandExit': command_exit, 'normalExitStage': normal_exit,
                              'ownResourcesReleased': resources_released, 'functionalAcceptanceComplete': functional_complete,
                              'scope': case.get('scope')})
          (evidence / 'isolated-payloads-and-cleanup.json').write_text(json.dumps(results, indent=2) + '\n')
          if functional_failed:
              raise RuntimeError('Required plugin install, original Desktop reload/load or own Launcher/Web resource evidence is unknown or incomplete')
          PY

      - name: Detach the read-only runtime even on failure
        if: always()
        run: |
          if mount | grep -Fq " on $T08_RUNTIME_MOUNT "; then
            set +e
            hdiutil detach "$T08_RUNTIME_MOUNT" > "$EVIDENCE_DIR/runtime-detach.log" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "$EVIDENCE_DIR/runtime-detach.exit"
            cat "$EVIDENCE_DIR/runtime-detach.log"
            exit "$result"
          fi

      - name: Upload T08 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-launcher-t08-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flutter-launcher-acceptance/T08
          if-no-files-found: error

  preference-only:
    if: github.event_name == 'workflow_dispatch' && inputs.preference_only
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Prepare PREFERENCE runner evidence
        run: |
          acceptance_evidence="$RUNNER_TEMP/flutter-launcher-acceptance/PREFERENCE"
          mkdir -p "$acceptance_evidence"
          printf 'EVIDENCE_DIR=%s\n' "$acceptance_evidence" >> "$GITHUB_ENV"
          printf 'PREFERENCE_RUNTIME_MOUNT=%s\n' "$RUNNER_TEMP/preference-runtime-mount" >> "$GITHUB_ENV"
          sw_vers > "$acceptance_evidence/macos-version.log"
          uname -m > "$acceptance_evidence/architecture.log"

      - name: Checkout current launcher without upstream initialization
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Bind current source and fixed runtime artifact
        run: |
          git rev-parse HEAD > "$EVIDENCE_DIR/source-commit.txt"
          printf '{"repository":"%s","runId":37325723931,"artifactName":"dsh-workflow-arm64"}\n' \
            "$GITHUB_REPOSITORY" > "$EVIDENCE_DIR/runtime-artifact-source.json"

      - name: Download the successful frozen arm64 runtime
        uses: actions/download-artifact@v4
        with:
          name: dsh-workflow-arm64
          run-id: 37325723931
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preference-runtime-artifact

      - name: Mount the frozen DMG read-only
        run: |
          shopt -s nullglob
          preference_dmgs=("$RUNNER_TEMP/preference-runtime-artifact/"*.dmg)
          test "${#preference_dmgs[@]}" -eq 1
          runtime_dmg="${preference_dmgs[0]}"
          shasum -a 256 "$runtime_dmg" > "$EVIDENCE_DIR/runtime-dmg.sha256"
          hdiutil verify "$runtime_dmg" > "$EVIDENCE_DIR/runtime-dmg-verify.log" 2>&1
          mkdir -p "$PREFERENCE_RUNTIME_MOUNT"
          set +e
          hdiutil attach -readonly -nobrowse -mountpoint "$PREFERENCE_RUNTIME_MOUNT" "$runtime_dmg" \
            > "$EVIDENCE_DIR/runtime-mount.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/runtime-mount.exit"
          cat "$EVIDENCE_DIR/runtime-mount.log"
          test "$result" -eq 0
          runtime_resources="$PREFERENCE_RUNTIME_MOUNT/DSH Workflow.app/Contents/Resources"
          test -x "$runtime_resources/node"
          test -d "$runtime_resources/desktop/DeepSeek Harness.app"
          test "$("$runtime_resources/node" -p 'process.arch')" = arm64
          printf 'PREFERENCE_RUNTIME_RESOURCES=%s\n' "$runtime_resources" >> "$GITHUB_ENV"
          shasum -a 256 "$runtime_resources/node" \
            "$runtime_resources/desktop/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            "$runtime_resources/desktop/DeepSeek Harness.app/Contents/Resources/app/dsh/node_modules/@deepseek-ai/dsh-desktop-host/lib/index.js" \
            > "$EVIDENCE_DIR/runtime-payload.sha256"

      - name: Set up the fixed current Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6

      - name: Set up fixed project Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Build current maintained Matt package
        run: |
          npm ci --prefix matt-skills-panel-plugin --ignore-scripts --no-audit --no-fund
          npm run build --prefix matt-skills-panel-plugin

      - name: Prepare locked validation metadata without building an App
        working-directory: macos-launcher/flutter
        run: flutter pub get --enforce-lockfile

      - name: Verify original successful Native Debug provenance
        uses: actions/github-script@v8
        with:
          script: |
            const source = '94f82e0d6012cbf31bce8f69f281af6839ea1169';
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 37866760770});
            const {data: artifact} = await github.rest.actions.getArtifact({...context.repo, artifact_id: 11588566917});
            if (run.head_sha !== source || run.status !== 'completed' || run.conclusion !== 'success' ||
                run.path !== '.github/workflows/flutter-launcher-acceptance.yml' ||
                run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                artifact.workflow_run.id !== run.id || artifact.workflow_run.head_sha !== source || artifact.expired ||
                artifact.name !== `flutter-debug-app-t07-${run.id}-${run.run_attempt}` ||
                artifact.digest !== 'sha256:940ad67ec8668539f5f1be081a814e08b4ce30b360f3874fe43bf9010fd0a0ff') {
              throw new Error('Original Native Debug artifact provenance is not the verified successful S source');
            }
            require('fs').writeFileSync(`${process.env.EVIDENCE_DIR}/native-debug-artifact-source.json`, JSON.stringify({runId:run.id, head_sha:run.head_sha, path:run.path, conclusion:run.conclusion, runAttempt:run.run_attempt, artifactId:artifact.id, artifactName:artifact.name, digest:artifact.digest}));

      - name: Download exact original Native Debug bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/11588566917/zip" \
            -o "$EVIDENCE_DIR/native-debug-artifact.zip"
          python3 - <<'PYDEBUG'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE_DIR'])
          archive = evidence / 'native-debug-artifact.zip'
          actual_digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (evidence / 'native-debug-download.sha256').write_text(actual_digest + '\n')
          assert actual_digest == '940ad67ec8668539f5f1be081a814e08b4ce30b360f3874fe43bf9010fd0a0ff'
          bundle = Path(os.environ['RUNNER_TEMP']) / 'preference-debug-bundle'
          bundle.mkdir(mode=0o700)
          with zipfile.ZipFile(archive) as zipped:
              entries = zipped.infolist()
              assert len(entries) == 2 and {entry.filename for entry in entries} == {'manifest.json', 'app.tar.gz'}
              assert all(stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG) for entry in entries)
              contents = {entry.filename: zipped.read(entry) for entry in entries}
          manifest = json.loads(contents['manifest.json'])
          assert manifest['producer']['sourceCommit'] == 'b3045b4dc2b78c2004003a9f77d15d42a8c3cd4f'
          assert str(manifest['producer']['runId']) == '37838756597'
          assert manifest['inputs']['key'] == 'flutter-debug-v1-daf637d77e2d0eeb530f22973ef9e90c208340b6a71309b26525f594f5b16385'
          assert manifest['archiveSha256'] == '65ca2d5107299c8a55ee6642136a8c70e3445dd243f64bd93687d60175673b29'
          for name, content in contents.items(): (bundle / name).write_bytes(content)
          (evidence / 'debug-app-manifest.json').write_bytes(contents['manifest.json'])
          PYDEBUG

      - name: Restore only exact original Native Debug bytes
        run: |
          python3 .github/scripts/flutter_debug_artifact.py inputs \
            --root "$GITHUB_WORKSPACE" --output "$EVIDENCE_DIR/debug-build-inputs.json"
          set +e
          python3 .github/scripts/flutter_debug_artifact.py restore \
            --inputs "$EVIDENCE_DIR/debug-build-inputs.json" --bundle "$RUNNER_TEMP/preference-debug-bundle" \
            --destination 'macos-launcher/flutter/build/macos/Build/Products/Debug/DSH Workflow.app' \
            --receipt "$EVIDENCE_DIR/debug-app-decision.json" > "$EVIDENCE_DIR/debug-app-restore.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/debug-app-restore.exit"
          cat "$EVIDENCE_DIR/debug-app-restore.log"
          exit "$result"

      - name: Stage the current relative application association
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          app = root / 'macos-launcher/flutter/build/macos/Build/Products/Debug/DSH Workflow.app'
          manifest = json.loads((root / 'maclauncher.json').read_text())
          manifest['entry']['path'] = '../..'
          target = app / 'Contents/Resources/maclauncher.json'
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          evidence = Path(os.environ['EVIDENCE_DIR'])
          (evidence / 'input-association.json').write_text(target.read_text())
          (evidence / 'input-app.txt').write_text(str(app) + '\n')
          PY

      - name: Exercise startup-visible preference with real Desktop
        working-directory: macos-launcher/flutter
        run: |
          set +e
          dart run tool/application_probe.dart \
            'build/macos/Build/Products/Debug/DSH Workflow.app/Contents/MacOS/DSH Workflow' \
            --desktop-window-runtime "$PREFERENCE_RUNTIME_RESOURCES" --window-start show --web-port 33080 \
            > "$EVIDENCE_DIR/show.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/show.exit"
          cat "$EVIDENCE_DIR/show.log"
          exit "$result"

      - name: Bind the one actual saved preference profile
        run: |
          python3 - <<'PYROOT'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / '.github/scripts'))
          from settings_startup_cycle import validate_observation_root
          evidence = Path(os.environ['EVIDENCE_DIR'])
          roots = re.findall(r'^ISOLATED_ROOT=(.+)$', (evidence / 'show.log').read_text(), re.M)
          assert len(roots) == 1, 'Expected one actual saved preference profile'
          root = validate_observation_root(Path(roots[0]), Path(os.environ['RUNNER_TEMP']))
          (evidence / 'preference-show-root.json').write_text(json.dumps({'root': str(root)}) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write('PREFERENCE_SHOW_ROOT=' + str(root) + '\n')
          PYROOT

      - name: Restart exact saved startup preference profile
        working-directory: macos-launcher/flutter
        run: |
          set +e
          dart run tool/application_probe.dart \
            'build/macos/Build/Products/Debug/DSH Workflow.app/Contents/MacOS/DSH Workflow' \
            --desktop-window-restart "$PREFERENCE_SHOW_ROOT" \
            > "$EVIDENCE_DIR/restart.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/restart.exit"
          cat "$EVIDENCE_DIR/restart.log"
          exit "$result"

      - name: Exercise startup-hidden preference with real Desktop
        working-directory: macos-launcher/flutter
        run: |
          set +e
          dart run tool/application_probe.dart \
            'build/macos/Build/Products/Debug/DSH Workflow.app/Contents/MacOS/DSH Workflow' \
            --desktop-window-runtime "$PREFERENCE_RUNTIME_RESOURCES" --window-start hidden --web-port 33080 \
            > "$EVIDENCE_DIR/hidden.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/hidden.exit"
          cat "$EVIDENCE_DIR/hidden.log"
          exit "$result"

      - name: Collect only actual private preference observations
        if: always()
        run: |
          python3 - <<'PYEVIDENCE'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from settings_startup_cycle import sanitize_json, sanitize_text, validate_observation_root
          evidence = Path(os.environ['EVIDENCE_DIR'])
          for case in ('show', 'hidden'):
              log = evidence / (case + '.log')
              for name in re.findall(r'^ISOLATED_ROOT=(.+)$', log.read_text(), re.M) if log.is_file() else []:
                  root = validate_observation_root(Path(name), Path(os.environ['RUNNER_TEMP']))
                  selections = [(root, evidence / case / root.name)]
                  sessions = root / 'restart-sessions'
                  if sessions.exists():
                      assert not sessions.is_symlink() and sessions.is_dir() and sessions.resolve() == sessions
                      for session in sessions.iterdir():
                          assert not session.is_symlink() and session.is_dir() and session.resolve().parent == sessions and session.name.startswith('run-')
                          selections.append((session, evidence / case / root.name / 'restart-sessions' / session.name))
                          cleanup = session / 'dsh-restart-cleanup'
                          if cleanup.exists():
                              assert not cleanup.is_symlink() and cleanup.is_dir() and cleanup.resolve().parent == session
                              selections.append((cleanup, evidence / case / root.name / 'restart-sessions' / session.name / cleanup.name))
                  for source, target in selections:
                      target.mkdir(parents=True, exist_ok=True)
                      for file in source.iterdir():
                          if file.suffix not in ('.log', '.json', '.jsonl'): continue
                          assert not file.is_symlink() and file.is_file() and file.resolve().parent == source
                          if file.suffix == '.json': output = json.dumps(sanitize_json(json.loads(file.read_text()))) + '\n'
                          elif file.suffix == '.jsonl': output = ''.join(json.dumps(sanitize_json(json.loads(line))) + '\n' for line in file.read_text().splitlines() if line)
                          else: output = sanitize_text(file.read_text())
                          (target / file.name).write_text(output)
          PYEVIDENCE

      - name: Detach the read-only preference runtime
        if: always()
        run: |
          if mount | grep -Fq " on $PREFERENCE_RUNTIME_MOUNT "; then
            set +e
            hdiutil detach "$PREFERENCE_RUNTIME_MOUNT" > "$EVIDENCE_DIR/runtime-detach.log" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "$EVIDENCE_DIR/runtime-detach.exit"
            exit "$result"
          fi

      - name: Upload preference evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-launcher-preference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/flutter-launcher-acceptance/PREFERENCE
            !${{ runner.temp }}/flutter-launcher-acceptance/PREFERENCE/native-debug-artifact.zip
          if-no-files-found: error

      - name: Preserve the three original actual preference exits
        if: always()
        run: |
          for case in show restart hidden; do
            test -f "$EVIDENCE_DIR/$case.exit"
            test "$(cat "$EVIDENCE_DIR/$case.exit")" -eq 0
          done
          ! grep -Fq 'RESTART_INDEPENDENT_CLEANUP_WARNING:' "$EVIDENCE_DIR/restart.log"

  actor-only:
    if: github.event_name == 'workflow_dispatch' && inputs.actor_only && !inputs.preference_only
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Prepare owned actor evidence
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/actor-only"
          printf 'EVIDENCE_DIR=%s\n' "$RUNNER_TEMP/actor-only" >> "$GITHUB_ENV"
      - name: Build sanctioned public-close UI actor without an AUT dependency
        working-directory: macos-launcher/flutter
        run: |
          python3 - <<'PYACTOR'
          import hashlib, json, os, pathlib, plistlib, shutil, subprocess, sys
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          derived = evidence / 'public-close-actor-build'
          arch = subprocess.check_output(['uname', '-m'], text=True).strip()
          assert arch == 'arm64'
          command = ['xcodebuild', '-project', 'tool/release_close_actor/Actor.xcodeproj',
                     '-scheme', 'PublicCloseActor', '-configuration', 'Debug',
                     '-destination', 'platform=macOS,arch=' + arch,
                     '-derivedDataPath', str(derived), 'build-for-testing']
          with (evidence / 'public-close-actor-build.log').open('w') as output:
              result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT)
          (evidence / 'public-close-actor-build.exit').write_text(str(result.returncode) + '\n')
          if result.returncode: sys.exit(result.returncode)
          inputs = list((derived / 'Build/Products').glob('*.xctestrun'))
          assert len(inputs) == 1
          path = inputs[0].resolve()
          target = plistlib.loads(path.read_bytes())['PublicCloseUITests']
          assert target['IsUITestBundle'] is True and target['UseUITargetAppProvidedByTests'] is True
          assert 'UITargetAppPath' not in target and target['TestHostPath'].endswith('PublicCloseUITests-Runner.app')
          owned = ('tool/release_close_actor/Actor.xcodeproj/project.pbxproj',
                   'tool/release_close_actor/Actor.xcodeproj/xcshareddata/xcschemes/PublicCloseActor.xcscheme',
                   'tool/release_close_actor/PublicCloseUITests.swift',
                   'tool/release_close_actor/Actor.entitlements',
                   'tool/release_distribution_probe.dart', 'tool/release_window_observer.swift')
          sys.path.insert(0, '../../.github/scripts')
          from actor_validation_inputs import actor_signature
          runner = pathlib.Path(target['TestHostPath'].replace('__TESTROOT__', str(path.parent)))
          signed = subprocess.run(['codesign', '-d', '--entitlements', ':-', str(runner)], capture_output=True)
          assert signed.returncode == 0
          entitlements = plistlib.loads(signed.stdout)
          binaries = [runner / 'Contents/MacOS/PublicCloseUITests-Runner',
                      runner / 'Contents/PlugIns/PublicCloseUITests.xctest/Contents/MacOS/PublicCloseUITests']
          architectures = {str(binary): subprocess.check_output(['lipo', '-archs', str(binary)], text=True).strip() for binary in binaries}
          assert actor_signature(entitlements, architectures)
          metadata = {'command': command, 'actualExit': result.returncode, 'arch': arch,
                      'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'sourceHashes': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in owned},
                      'xctestrun': str(path), 'xctestrunSha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                      'target': target, 'effectiveRunnerEntitlements': entitlements, 'binaryArchitectures': architectures,
                      'defaultAUTDependency': False, 'UIBehaviorExecuted': False}
          (evidence / 'public-close-actor-build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          shutil.copy2(path, evidence / 'public-close-actor-build.xctestrun')
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write('DSH_T09_CLOSE_ACTOR_XCTESTRUN=' + str(path) + '\n')
          PYACTOR
      - name: Actual owned subject actor startup and exact close
        run: python3 macos-launcher/flutter/tool/release_close_actor/actor_smoke.py --xctestrun "$DSH_T09_CLOSE_ACTOR_XCTESTRUN" --evidence "$EVIDENCE_DIR"
      - name: Preserve exact owned actor smoke runtime
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, shutil, stat
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE_DIR'])
          report = evidence / 'actor-smoke-evidence.json'
          if report.is_file() and not report.is_symlink():
              root = Path(json.loads(report.read_text())['root'])
              runner = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              assert root.resolve() == root and root.parent == runner and root.name.startswith('dsh-t05-actor-')
              assert root.stat().st_uid == os.getuid() and stat.S_IMODE(root.stat().st_mode) == 0o700
              plans = []
              for name in ['public-close-actor.xctestrun', 'public-close-actor-ready', 'public-close-request',
                           'public-close-ack', 'public-close-driver-complete', 'release-window-identity.json']:
                  file = root / name
                  if file.exists() or file.is_symlink():
                      assert not file.is_symlink() and file.is_file() and file.resolve().parent == root
                      plans.append((file, evidence / name, False))
              result = root / 'public-close-actor.xcresult'
              if result.exists() or result.is_symlink():
                  assert result.is_dir() and not result.is_symlink() and result.resolve() == result
                  for file in result.rglob('*'):
                      assert not file.is_symlink() and file.resolve().is_relative_to(result)
                      assert stat.S_ISREG(file.lstat().st_mode) or stat.S_ISDIR(file.lstat().st_mode)
                  plans.append((result, evidence / result.name, True))
              for source, target, directory in plans:
                  if directory: shutil.copytree(source, target)
                  else: shutil.copy2(source, target)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-actor-only-${{ github.sha }}
          path: |
            ${{ env.EVIDENCE_DIR }}
            !${{ env.EVIDENCE_DIR }}/public-close-actor-build/**
          if-no-files-found: error

  t09-release:
    if: github.event_name == 'workflow_dispatch' && !inputs.actor_only && !inputs.preference_only && inputs.release_run_id != ''
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0
      - name: Prepare exact source and runner evidence
        env:
          EXPECTED_ARCH: arm64
        run: |
          set -euo pipefail
          acceptance_evidence="$RUNNER_TEMP/flutter-launcher-acceptance/T09-$EXPECTED_ARCH"
          mkdir -p "$acceptance_evidence"
          printf 'EVIDENCE_DIR=%s\n' "$acceptance_evidence" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$acceptance_evidence/source-commit.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          actual_arch="$(uname -m)"
          printf '%s\n' "$actual_arch" > "$acceptance_evidence/architecture.txt"
          test "$EXPECTED_ARCH" = arm64
          test "$actual_arch" = arm64
      - name: Verify actual successful Release producer at the exact dispatched SHA
        uses: actions/github-script@v8
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          PRODUCT_SOURCE_SHA: ${{ inputs.product_source_sha || github.sha }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.RELEASE_RUN_ID)) throw new Error('Invalid producer run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(process.env.RELEASE_RUN_ID)});
            if (run.head_sha !== process.env.PRODUCT_SOURCE_SHA || run.status !== 'completed' || run.conclusion !== 'success' ||
                run.path !== '.github/workflows/macos-app.yml' || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Release producer is not a completed successful build of the original product source');
            }
            require('fs').writeFileSync(`${process.env.EVIDENCE_DIR}/producer.json`, JSON.stringify({id:run.id, head_sha:run.head_sha, path:run.path, conclusion:run.conclusion, run_attempt:run.run_attempt}));
      - name: Verify unchanged product inputs when reusing an original producer
        env:
          PRODUCT_SOURCE_SHA: ${{ inputs.product_source_sha || github.sha }}
        run: |
          if test "$PRODUCT_SOURCE_SHA" != "$GITHUB_SHA"; then
            test "$PRODUCT_SOURCE_SHA" = 260fdbbb8a3697899e1133e3293e255df604e0d4
            python3 .github/scripts/actor_validation_inputs.py --base "$PRODUCT_SOURCE_SHA" --output "$EVIDENCE_DIR/product-material-reuse.json"
            python3 - <<'PY'
          import json, os
          value = json.load(open(os.environ['EVIDENCE_DIR'] + '/product-material-reuse.json'))
          assert value['helperOnly'] and value['materialInputsEqual']
          PY
          fi
      - name: Download this architecture's actual produced DMG
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          name: dsh-workflow-arm64
          path: ${{ runner.temp }}/t09-release-artifact
      - name: Verify and mount immutable DMG
        env:
          EXPECTED_ARCH: arm64
        run: |
          set -euo pipefail
          dmgs=("$RUNNER_TEMP/t09-release-artifact/"*.dmg)
          test "${#dmgs[@]}" -eq 1
          shasum -a 256 "${dmgs[0]}" > "$EVIDENCE_DIR/dmg.sha256"
          hdiutil verify "${dmgs[0]}" > "$EVIDENCE_DIR/dmg-verify.log" 2>&1
          mount="$RUNNER_TEMP/t09-release-mount"
          mkdir -p "$mount"
          printf 'T09_RELEASE_MOUNT=%s\n' "$mount" >> "$GITHUB_ENV"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${dmgs[0]}" > "$EVIDENCE_DIR/dmg-attach.log" 2>&1
          codesign --verify --deep --strict "$mount/DSH Workflow.app"
          "$mount/DSH Workflow.app/Contents/Resources/node" --version > "$EVIDENCE_DIR/packaged-node-version.txt"
          test "$(cat "$EVIDENCE_DIR/packaged-node-version.txt")" = v24.12.0
          packaged_arch="$("$mount/DSH Workflow.app/Contents/Resources/node" -p process.arch)"
          printf '%s\n' "$packaged_arch" > "$EVIDENCE_DIR/packaged-node-process-arch.txt"
          test "$packaged_arch" = "$EXPECTED_ARCH"
          file "$mount/DSH Workflow.app/Contents/Resources/node" > "$EVIDENCE_DIR/packaged-node-architecture.txt"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
      - name: Resolve only locked validation-tool dependencies
        working-directory: macos-launcher/flutter
        run: flutter pub get --enforce-lockfile
      - name: Build sanctioned public-close UI actor without an AUT dependency
        working-directory: macos-launcher/flutter
        run: |
          python3 - <<'PYACTOR'
          import hashlib, json, os, pathlib, plistlib, shutil, subprocess, sys
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          derived = evidence / 'public-close-actor-build'
          arch = subprocess.check_output(['uname', '-m'], text=True).strip()
          assert arch == 'arm64'
          command = ['xcodebuild', '-project', 'tool/release_close_actor/Actor.xcodeproj',
                     '-scheme', 'PublicCloseActor', '-configuration', 'Debug',
                     '-destination', 'platform=macOS,arch=' + arch,
                     '-derivedDataPath', str(derived), 'build-for-testing']
          with (evidence / 'public-close-actor-build.log').open('w') as output:
              result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT)
          (evidence / 'public-close-actor-build.exit').write_text(str(result.returncode) + '\n')
          if result.returncode: sys.exit(result.returncode)
          inputs = list((derived / 'Build/Products').glob('*.xctestrun'))
          assert len(inputs) == 1
          path = inputs[0].resolve()
          target = plistlib.loads(path.read_bytes())['PublicCloseUITests']
          assert target['IsUITestBundle'] is True and target['UseUITargetAppProvidedByTests'] is True
          assert 'UITargetAppPath' not in target and target['TestHostPath'].endswith('PublicCloseUITests-Runner.app')
          owned = ('tool/release_close_actor/Actor.xcodeproj/project.pbxproj',
                   'tool/release_close_actor/Actor.xcodeproj/xcshareddata/xcschemes/PublicCloseActor.xcscheme',
                   'tool/release_close_actor/PublicCloseUITests.swift',
                   'tool/release_close_actor/Actor.entitlements',
                   'tool/release_distribution_probe.dart', 'tool/release_window_observer.swift')
          sys.path.insert(0, '../../.github/scripts')
          from actor_validation_inputs import actor_signature
          runner = pathlib.Path(target['TestHostPath'].replace('__TESTROOT__', str(path.parent)))
          signed = subprocess.run(['codesign', '-d', '--entitlements', ':-', str(runner)], capture_output=True)
          assert signed.returncode == 0
          entitlements = plistlib.loads(signed.stdout)
          binaries = [runner / 'Contents/MacOS/PublicCloseUITests-Runner',
                      runner / 'Contents/PlugIns/PublicCloseUITests.xctest/Contents/MacOS/PublicCloseUITests']
          architectures = {str(binary): subprocess.check_output(['lipo', '-archs', str(binary)], text=True).strip() for binary in binaries}
          assert actor_signature(entitlements, architectures)
          metadata = {'command': command, 'actualExit': result.returncode, 'arch': arch,
                      'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'sourceHashes': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in owned},
                      'xctestrun': str(path), 'xctestrunSha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                      'target': target, 'effectiveRunnerEntitlements': entitlements, 'binaryArchitectures': architectures,
                      'defaultAUTDependency': False, 'UIBehaviorExecuted': False}
          (evidence / 'public-close-actor-build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          shutil.copy2(path, evidence / 'public-close-actor-build.xctestrun')
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write('DSH_T09_CLOSE_ACTOR_XCTESTRUN=' + str(path) + '\n')
          PYACTOR
      - name: Actual moved Release SDK, window and associated-entry acceptance
        working-directory: macos-launcher/flutter
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          dart run tool/release_distribution_probe.dart --release "$T09_RELEASE_MOUNT/DSH Workflow.app" > "$EVIDENCE_DIR/release-distribution.log" 2>&1
      - name: Preserve exact owned tool evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os, re, shutil, stat
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE_DIR'])
          runner = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert evidence.is_dir() and not evidence.is_symlink() and evidence.resolve() == evidence
          assert evidence.is_relative_to(runner) and evidence.stat().st_uid == os.getuid()
          copies = []
          def plan_file(source, name, parent):
              assert stat.S_ISREG(source.lstat().st_mode) and not source.is_symlink()
              assert source.resolve(strict=True) == source and source.parent == parent
              destination = evidence / name
              assert not destination.is_symlink() and (not destination.exists() or destination.is_file())
              copies.append((source, destination, False))
          log = evidence / 'release-distribution.log'
          roots = re.findall(r'^T09_ROOT=(.+)$', log.read_text(), re.M) if log.is_file() else []
          if len(roots) > 1:
              raise RuntimeError('Ambiguous owned T09 probe root')
          if len(roots) == 1:
              root = Path(roots[0])
              assert root.resolve() == root and root.parent == runner and root.name.startswith('dsh-t05-t09-')
              assert root.stat().st_uid == os.getuid() and stat.S_IMODE(root.stat().st_mode) == 0o700
              for name in ['release-distribution-evidence.json', 'release-window-identity.json',
                           'public-close-actor.log', 'public-close-actor.xctestrun',
                           'public-close-actor-ready', 'public-close-request', 'public-close-ack',
                           'public-close-driver-complete']:
                  source = root / name
                  if source.exists() or source.is_symlink():
                      plan_file(source, name, root)
              result = root / 'public-close-actor.xcresult'
              if result.exists() or result.is_symlink():
                  assert result.is_dir() and not result.is_symlink() and result.resolve() == result
                  for child in result.rglob('*'):
                      assert not child.is_symlink() and child.resolve(strict=True).is_relative_to(result)
                      assert stat.S_ISREG(child.lstat().st_mode) or stat.S_ISDIR(child.lstat().st_mode)
                  destination = evidence / result.name
                  assert not destination.exists() and not destination.is_symlink()
                  copies.append((result, destination, True))
          build = evidence / 'public-close-actor-build'
          products = build / 'Build/Products'
          if products.exists() or products.is_symlink():
              for directory in [build, build / 'Build', products]:
                  assert directory.is_dir() and not directory.is_symlink() and directory.resolve() == directory
              inputs = list(products.glob('*.xctestrun'))
              assert len(inputs) <= 1
              if inputs:
                  plan_file(inputs[0], 'public-close-actor-build.xctestrun', products)
          # Preflight all selected sources before copying any runtime payload.
          for source, destination, directory in copies:
              if directory:
                  shutil.copytree(source, destination)
              else:
                  shutil.copy2(source, destination)
          PYTHON
      - name: Detach only the owned read-only mount
        if: always() && env.T09_RELEASE_MOUNT != ''
        run: hdiutil detach "$T09_RELEASE_MOUNT" > "$EVIDENCE_DIR/dmg-detach.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-launcher-T09-release-arm64
          path: |
            ${{ env.EVIDENCE_DIR }}
            !${{ env.EVIDENCE_DIR }}/public-close-actor-build/**
          if-no-files-found: error
