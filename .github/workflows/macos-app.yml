name: macOS Release

on:
  push:
    tags:
      - macos-v*

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout release source and fixed submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check release source and ARM64 platform
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == Ghost233/DSH-Workflow ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          [[ "$RELEASE_TAG" == "macos-v$(/usr/bin/python3 -c 'import json; print(json.load(open("macos-launcher/package.json"))["version"])')" ]]

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7

      - name: Build and package ARM64 release
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          scripts/build-local-release.sh
          cat .build/release-assets/manifest.json

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: scripts/publish-release.sh
