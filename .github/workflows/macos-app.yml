name: macOS Launcher

on:
  pull_request:
    paths:
      - .github/workflows/macos-app.yml
      - macos-launcher/**
      - maclauncher.json
      - agent-observation-plugin/**
      - matt-skills-panel-plugin/**
      - scripts/project-plugins.mjs
      - scripts/project-plugin-resolver.mjs
      - scripts/harness-runtime.mjs
      - scripts/dsh-launch-composition.mjs
      - scripts/web-host-lifecycle.mjs
      - scripts/release.sh
      - scripts/release.py
      - scripts/test_release.py
      - scripts/build-release.sh
      - .agents/skills/macos-release/**
      - docs/agents/release.md
      - package.json
      - dsh-runtime.json
      - .gitmodules
      - deepseek-harness
  push:
    branches:
      - main
    tags:
      - macos-v*
    paths:
      - .github/workflows/macos-app.yml
      - macos-launcher/**
      - maclauncher.json
      - agent-observation-plugin/**
      - matt-skills-panel-plugin/**
      - scripts/project-plugins.mjs
      - scripts/project-plugin-resolver.mjs
      - scripts/harness-runtime.mjs
      - scripts/dsh-launch-composition.mjs
      - scripts/web-host-lifecycle.mjs
      - scripts/release.sh
      - scripts/release.py
      - scripts/test_release.py
      - scripts/build-release.sh
      - .agents/skills/macos-release/**
      - docs/agents/release.md
      - package.json
      - dsh-runtime.json
      - .gitmodules
      - deepseek-harness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-inputs:
    runs-on: macos-15
    outputs:
      helper_only: ${{ steps.proof.outputs.helper_only }}
      native_reuse: ${{ steps.proof.outputs.native_reuse }}
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: proof
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 .github/scripts/actor_validation_inputs.py --base e2477054c5f84f59ccee52bf26be4a80919b5926 --output validation-inputs.json
          python3 - <<'PY'
          import json, os
          value = json.load(open('validation-inputs.json'))
          helper = value['helperOnly'] and value['materialInputsEqual'] and os.environ['EVENT_NAME'] != 'workflow_dispatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('helper_only=' + str(helper).lower() + '\n')
              output.write('native_reuse=' + str(helper and value['nativeInputsEqual'] and value['base'] == 'e2477054c5f84f59ccee52bf26be4a80919b5926').lower() + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validation-material-inputs-${{ github.workflow }}
          path: validation-inputs.json
  build:
    needs: validation-inputs
    if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/macos-v') || needs.validation-inputs.result != 'success' || needs.validation-inputs.outputs.helper_only != 'true')
    runs-on: macos-15
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Checkout fixed DSH submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify actual checkout source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_source_sha="$(git rev-parse HEAD)"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
          printf 'Actual checkout source: %s\n' "$actual_source_sha"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Verify release command and packaging contract
        run: |
          bash -n scripts/release.sh scripts/build-release.sh
          python3 -B scripts/test_release.py

      - name: Set up the shared Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6

      - name: Build project-maintained Matt panel
        run: |
          npm ci --prefix matt-skills-panel-plugin --ignore-scripts --no-audit --no-fund
          npm run build --prefix matt-skills-panel-plugin
          npm test --prefix matt-skills-panel-plugin

      - name: Verify Flutter launcher and official SDK integration
        working-directory: macos-launcher/flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build macos --debug --no-pub
          dart run tool/native_probe.dart "build/macos/Build/Products/Debug/DSH Workflow.app/Contents/MacOS/DSH Workflow"

      - name: Initialize fixed DSH build dependencies
        working-directory: deepseek-harness
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify architecture and release version
        shell: bash
        env:
          EXPECTED_ARCH: arm64
          RELEASE_TAG: ${{ github.ref_name }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/macos-v') }}
        run: |
          set -euo pipefail
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          if [[ "$IS_RELEASE" == true ]]; then
            test "$RELEASE_TAG" = "macos-v$(node -p "require('./macos-launcher/package.json').version")"
          fi

      - name: Test Web and Desktop launch contract
        shell: bash
        run: |
          set -euo pipefail
          node --test macos-launcher/runtime/web-launch.test.mjs \
            macos-launcher/runtime/global-supervisor.test.mjs \
            macos-launcher/runtime/single-port-entry.test.mjs \
            macos-launcher/runtime/lan-gateway.test.mjs \
            macos-launcher/runtime/desktop-launch.test.mjs \
            macos-launcher/runtime/desktop-status.test.mjs

      - name: Build fixed DSH production packages
        working-directory: deepseek-harness
        env:
          DSH_DESKTOP_TARGET_PLATFORM: darwin
          DSH_DESKTOP_TARGET_ARCH: arm64
        run: |
          set -euo pipefail
          TARGET="$PWD/apps/desktop/.desktop-build/targets/mac-${DSH_DESKTOP_TARGET_ARCH}"
          pnpm run build:official
          pnpm run release:pack --family dsh --out "$TARGET/packed/dsh" --concurrency 4
          pnpm --dir apps/desktop-host pack --pack-destination "$TARGET/packed/dsh"
          pnpm run release:pack --family vendor --out "$TARGET/packed/vendor" --concurrency 4
          pnpm --dir native/system run build:ts
          mkdir -p "$TARGET/packed/landlock"
          pnpm --dir native/system/packages/entry pack --pack-destination "$TARGET/packed/landlock"
          pnpm --dir apps/desktop run prepare:runtime
          pnpm --dir apps/desktop run prepare:packages

      - name: Build and verify relocatable Desktop application
        id: desktop
        shell: bash
        run: |
          set -euo pipefail
          node deepseek-harness/node_modules/tsx/dist/cli.mjs macos-launcher/build-desktop-release.mjs
          DIRECTORY=mac-arm64
          APP="$PWD/.build/desktop-arm64/$DIRECTORY/DeepSeek Harness.app"
          node deepseek-harness/node_modules/tsx/dist/cli.mjs macos-launcher/verify-desktop-release.mjs "$APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Build macOS application
        env:
          DSH_MACOS_DESKTOP_APP: ${{ steps.desktop.outputs.app }}
        run: node macos-launcher/build.mjs

      - name: Verify packaged Desktop and observation integration
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./macos-launcher/package.json').version")"
          DSH_VERSION="$(node -p "require('./dsh-runtime.json').version")"
          node deepseek-harness/node_modules/tsx/dist/cli.mjs macos-launcher/verify-desktop-release.mjs \
            ".build/DSH Workflow-${APP_VERSION}-dsh${DSH_VERSION}-arm64.app"

      - name: Package and verify DMG
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          APP_VERSION="$(node -p "require('./macos-launcher/package.json').version")"
          DSH_VERSION="$(node -p "require('./dsh-runtime.json').version")"
          APP=".build/DSH Workflow-${APP_VERSION}-dsh${DSH_VERSION}-arm64.app"
          scripts/build-release.sh --app-path "$APP" --output-dir .build/release-assets
          echo 'assets=.build/release-assets' >> "$GITHUB_OUTPUT"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: dsh-workflow-arm64
          path: ${{ steps.package.outputs.assets }}/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Require macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Download the ARM64 macOS build
        uses: actions/download-artifact@v4
        with:
          name: dsh-workflow-arm64
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d ' ')" = 1
          (cd release-assets && shasum -a 256 -c SHA256SUMS)
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('release-assets')
          value = json.loads((root / 'manifest.json').read_text())
          version = os.environ['RELEASE_TAG'].removeprefix('macos-v')
          expected = f'DSH-Workflow-macOS-{version}-arm64.dmg'
          assert value['tag'] == os.environ['RELEASE_TAG'] and value['version'] == version
          assert value['sourceCommit'] == os.environ['RELEASE_COMMIT']
          assert len(value['assets']) == 1 and value['assets'][0]['name'] == expected
          assert value['assets'][0]['size'] == (root / expected).stat().st_size
          digest = hashlib.sha256()
          with (root / expected).open('rb') as file:
              for chunk in iter(lambda: file.read(1024 * 1024), b''):
                  digest.update(chunk)
          assert value['assets'][0]['sha256'] == digest.hexdigest()
          PY
          gh release create "$RELEASE_TAG" release-assets/*.dmg release-assets/manifest.json release-assets/SHA256SUMS --verify-tag \
            --title "DSH Workflow macOS ${RELEASE_TAG#macos-v}" \
            --notes "Automated macOS builds for Apple Silicon (ARM64). Locally ad-hoc signed; not notarized."
