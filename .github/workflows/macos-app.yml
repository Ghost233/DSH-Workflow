name: macOS Launcher

on:
  pull_request:
    paths:
      - .github/workflows/macos-app.yml
      - macos-launcher/**
      - owner-workflow-plugin/**
      - sol-efficiency-plugin/**
      - approve-for-me-workflow-plugin/**
      - scripts/project-plugins.mjs
      - scripts/project-plugin-resolver.mjs
      - scripts/harness-runtime.mjs
      - scripts/kernel-launch-composition.mjs
      - scripts/web-host-lifecycle.mjs
      - package.json
      - dsh-runtime.json
      - .gitmodules
      - deepseek-harness
  push:
    tags:
      - macos-v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout fixed DSH and approval submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Verify architecture and release version
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/macos-v') }}
        run: |
          set -euo pipefail
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          if [[ "$IS_RELEASE" == true ]]; then
            test "$RELEASE_TAG" = "macos-v$(node -p "require('./macos-launcher/package.json').version")"
          fi

      - name: Build native fs-ext for this runner
        run: npm ci --prefix owner-workflow-plugin --no-audit --no-fund

      - name: Test update selection and launch contract
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library macos-launcher/Sources/UpdatePolicy.swift macos-launcher/Tests/UpdatePolicyTests.swift -o "$RUNNER_TEMP/update-policy-tests"
          "$RUNNER_TEMP/update-policy-tests"
          node --test macos-launcher/runtime/web-launch.test.mjs

      - name: Build macOS application
        run: node macos-launcher/build.mjs

      - name: Package and verify app
        id: package
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./macos-launcher/package.json').version")"
          DSH_VERSION="$(node -p "require('./dsh-runtime.json').version")"
          APP=".build/DSH Workflow-${APP_VERSION}-dsh${DSH_VERSION}-${TARGET_ARCH}.app"
          ZIP="DSH-Workflow-macOS-${APP_VERSION}-${TARGET_ARCH}.zip"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          test -s "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: dsh-workflow-${{ matrix.arch }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both macOS builds
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-workflow-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name '*.zip' -type f | wc -l | tr -d ' ')" = 2
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip --verify-tag \
              --title "DSH Workflow macOS ${RELEASE_TAG#macos-v}" \
              --notes "Automated macOS builds for Apple Silicon and Intel. Locally ad-hoc signed; not notarized."
          fi
