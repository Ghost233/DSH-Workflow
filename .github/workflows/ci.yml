name: DSH Project CI

on:
  push:
    paths:
      - .github/workflows/ci.yml
      - agent-observation-plugin/**
      - matt-skills-panel-plugin/**
      - dynamic-workflow-plugin/**
      - scripts/**
      - vendor/**
      - deepseek-harness
      - .gitmodules
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - dsh-runtime.json
      - project-plugins.json
      - project-plugins.lock.json
      - maclauncher.json
      - start-dsh-workflow.sh
      - '!**/*.md'
  pull_request:

jobs:
  matt-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Build and verify project-maintained Matt panel
        run: |
          npm ci --prefix matt-skills-panel-plugin --ignore-scripts --no-audit --no-fund
          npm run build --prefix matt-skills-panel-plugin
          npm test --prefix matt-skills-panel-plugin

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出固定子模块
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: 启用 Corepack
        run: corepack enable

      - name: 核对子模块 gitlink 与只读状态
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:deepseek-harness)" = "$(git -C deepseek-harness rev-parse HEAD)"
          test -z "$(git -C deepseek-harness status --porcelain --untracked-files=all)"

      - name: 核对 JEV/监控客户端产物
        run: npm run check:client

      - name: 安装固定 DSH 开发依赖
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: 构建固定 DSH 库
        working-directory: deepseek-harness
        run: pnpm run build:lib

      - name: 构建当前平台 DSH 原生模块
        working-directory: deepseek-harness
        run: pnpm run build:native-system

      - name: 准备 DSH CI 沙箱
        working-directory: deepseek-harness
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: 运行 当前自研项目测试
        run: npm test
