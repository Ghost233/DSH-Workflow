name: Prepare pinned Tobs artifacts

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the pinned upstream packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/tobs-upstream
          docker build --file tools/tobs-builder.Dockerfile --tag dsh-workflow-tobs-builder tools
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/.build/tobs-upstream,target=/work" \
            --workdir /work dsh-workflow-tobs-builder \
            node /workspace/scripts/build-tobs-source.mjs /work
      - name: Verify the package set against the project lock
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { readArtifactSet } from './scripts/upstream-artifacts.mjs'
          const load = path => JSON.parse(readFileSync(path, 'utf8'))
          const pin = load('vendor/tobs.upstream.json')
          const item = load('project-plugins.json').plugins.find(row => row.package === '@botharness/tobs')
          const lock = load('project-plugins.lock.json').plugins.find(row => row.package === item.package)
          const set = await readArtifactSet(process.cwd(), item)
          if (item.version !== pin.version || item.commit !== pin.commit
            || lock?.commit !== pin.commit || lock.artifactSetSha256 !== set.manifestSha256) {
            throw new Error('Tobs build does not match the fixed version, commit and artifact digest')
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${pin.version}\n`)
          console.log(JSON.stringify({ version: pin.version, commit: pin.commit, sha256: set.manifestSha256, packages: set.entries.length }))
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-tobs-packages
          path: |
            .build/tobs-upstream/artifacts/${{ steps.verify.outputs.version }}/*.tgz
            .build/tobs-upstream/artifacts/${{ steps.verify.outputs.version }}/artifacts.json
            .build/tobs-upstream/artifacts/${{ steps.verify.outputs.version }}/release-plan.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
