<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hub-bot 面板</title>
<link rel="stylesheet" href="/hub-bot/panel/style.css">
</head>
<body>
<header class="topbar">
  <h1>hub-bot</h1>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="board" role="tab">三问</button>
    <button class="tab" data-tab="settings" role="tab">设置</button>
  </nav>
  <span id="refreshed" class="refreshed" title="上次刷新时间"></span>
</header>

<main id="app">
  <section id="token-gate" class="token-gate" hidden>
    <p>输入管理 token（与 profile 的 <code>devApi.token</code> 相同）以打开面板。</p>
    <form id="token-form">
      <input id="token-input" type="password" autocomplete="off" placeholder="x-hub-bot-token">
      <button type="submit">进入</button>
    </form>
    <p id="token-error" class="error" hidden></p>
  </section>

  <section id="board" class="page" hidden>
    <div id="health" class="health" hidden></div>
    <h2 class="q">有需要我的吗？</h2>
    <div id="needs-me" class="cards"></div>
    <h2 class="q">什么状态？</h2>
    <div id="by-stage" class="groups"></div>
    <h2 class="q">结果在哪？</h2>
    <div id="outcomes" class="cards"></div>
    <h2 class="q">谁在干活？</h2>
    <div id="owners" class="cards"></div>
    <h2 class="q">最近听到了什么？</h2>
    <div id="triggers" class="cards"></div>
  </section>

  <section id="settings" class="page" hidden></section>
</main>

<script src="/hub-bot/panel/vendor/qrcode.js"></script>
<script src="/hub-bot/panel/app.js"></script>
</body>
</html>
